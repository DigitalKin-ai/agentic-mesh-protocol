syntax = "proto3";

package agentic_mesh_protocol.cost.v1;

import "agentic_mesh_protocol/cost/v1/cost_enums.proto";
import "agentic_mesh_protocol/cost/v1/cost_messages.proto";
import "agentic_mesh_protocol/pagination/v1/bulk.proto";
import "agentic_mesh_protocol/pagination/v1/pagination.proto";
import "buf/validate/validate.proto";

// ═════════════════════════════════════ Add Cost ════════════════════════════════════ //

// AddCostRequest is the request message for adding a cost entry.
message CreateCostRequest {
  // mission_id is the mission ID to link this cost to.
  string mission_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "mission_id_prefix"
      expression: "this.startsWith('missions:')"
      message: "missions must start with 'mission:'"
    },
    (buf.validate.field).cel = {
      id: "mission_id_length"
      expression: "this.size() >= 10"
      message: "missions must be at least 1 characters long"
    }
  ];
  // setup_version_id is the setup version ID to associate with this cost.
  string setup_version_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "setup_version_id_prefix"
      expression: "this.startsWith('setup_versions:')"
      message: "setup_version_id must start with 'setup_versions:'"
    },
    (buf.validate.field).cel = {
      id: "setup_version_id_length"
      expression: "this.size() >= 16"
      message: "setup_version_id must be at least 16 characters long"
    }
  ];
  // name is the descriptive name for this cost.
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // cost is the total cost value.
  double cost = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).double.gt = 0,
    (buf.validate.field).double.finite = true
  ];
  // quantity is the number of units consumed.
  double quantity = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).double.gt = 0,
    (buf.validate.field).double.finite = true
  ];
  // rate is the cost per unit.
  double rate = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).double.gt = 0,
    (buf.validate.field).double.finite = true
  ];
  // unit is the unit of measurement (e.g., "tokens", "calls", "GB").
  string unit = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // cost_type is the classification of the cost.
  CostType type = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
}

// AddCostResponse is the response message for adding a cost entry.
message CreateCostResponse {
  // Result of the operation. Expected oneof type: Cost or OperationError.
  CostResult result = 1 [(buf.validate.field).required = true];
}

// ═════════════════════════════════════ List Costs ════════════════════════════════════ //

// GetCostsRequest is the request message for retrieving multiple costs.
message ListCostsRequest {
  // mission_id is the mission ID to query costs for.
  string mission_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "mission_id_prefix"
      expression: "this.startsWith('missions:')"
      message: "missions must start with 'mission:'"
    },
    (buf.validate.field).cel = {
      id: "mission_id_length"
      expression: "this.size() >= 10"
      message: "missions must be at least 1 characters long"
    }
  ];
  // pagination contains pagination settings.
  agentic_mesh_protocol.pagination.v1.PaginationRequest pagination = 2 [(buf.validate.field).required = true];
  // filter contains optional filtering criteria (optional).
  optional CostFilter filter = 3 [(buf.validate.field).required = false];
}

// GetCostsResponse is the response message containing multiple costs.
message ListCostsResponse {
  // Result of the operation. Expected oneof type: Cost or OperationError.
  repeated CostResult result = 1 [(buf.validate.field).required = true];
  // bulk contains information about the bulk operation and pagination.
  agentic_mesh_protocol.pagination.v1.BulkResponse bulk = 2 [(buf.validate.field).required = true];
}

// ════════════════════════════════ List Cost Config ═════════════════════════════════ //

// GetCostConfigRequest is the request for retrieving cost configurations.
message ListCostConfigRequest {
  // setup_version_id identifies the setup version to get cost config for.
  string setup_version_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "setup_versions:",
    (buf.validate.field).string.min_len = 1
  ];

  // pagination contains pagination settings
  optional agentic_mesh_protocol.pagination.v1.PaginationRequest pagination = 2 [(buf.validate.field).required = false];
}

// GetCostConfigResponse is the response containing cost configurations.
message ListCostConfigResponse {
  // Result of the operation. Expected oneof type: Cost or OperationError.
  repeated CostResult result = 1 [(buf.validate.field).required = true];
  // bulk contains information about the bulk operation and pagination.
  agentic_mesh_protocol.pagination.v1.BulkResponse bulk = 2 [(buf.validate.field).required = true];
}

// ════════════════════════════════ Set Cost Config ═════════════════════════════════ //

// SetCostConfigRequest is the request for storing cost configurations.
message SetCostConfigRequest {
  // setup_version_id identifies the setup version to set cost config for.
  string setup_version_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "setup_versions:",
    (buf.validate.field).string.min_len = 1
  ];

  // configs is the list of cost configuration entries to store.
  repeated CostConfig configs = 2 [(buf.validate.field).required = true];
}

// SetCostConfigResponse is the response for storing cost configurations.
message SetCostConfigResponse {
  // Result of the operation. Expected oneof type: Cost or OperationError.
  repeated CostResult result = 1 [(buf.validate.field).required = true];
  // bulk contains information about the bulk operation and pagination.
  agentic_mesh_protocol.pagination.v1.BulkResponse bulk = 2 [(buf.validate.field).required = true];
}
