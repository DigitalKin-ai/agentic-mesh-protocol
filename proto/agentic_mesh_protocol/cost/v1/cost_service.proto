syntax = "proto3";

package agentic_mesh_protocol.cost.v1;

import "agentic_mesh_protocol/cost/v1/cost_dto.proto";

// CostService tracks and queries the operational costs of the missions.
service CostService {
  // CreateCost records a cost entry for a mission.
  rpc CreateCost(CreateCostRequest) returns (CreateCostResponse);
  // ListCosts retrieves a page of the cost entries of a mission, optionally filtered.
  rpc ListCosts(ListCostsRequest) returns (ListCostsResponse);
  // ListCostConfigs retrieves a page of the cost configurations of a setup version.
  rpc ListCostConfigs(ListCostConfigsRequest) returns (ListCostConfigsResponse);
  // SetCostConfig replaces the cost configurations of a setup version.
  rpc SetCostConfig(SetCostConfigRequest) returns (SetCostConfigResponse);
}
