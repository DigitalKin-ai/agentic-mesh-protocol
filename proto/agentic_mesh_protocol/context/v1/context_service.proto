syntax = "proto3";

package agentic_mesh_protocol.context.v1;

import "agentic_mesh_protocol/context/v1/context_requests.proto";

// ContextService: read the enterprise knowledge a caller is allowed to see.
//
// One entry point, by design. Sources are connected through the product API and indexed by
// the Context Platform; an agent only ever asks a question and receives cited passages. It
// never reaches an index, a provider or a credential.
//
// Permissions are not this service's to apply: the Context Platform compiles the caller's
// access filter into the query it runs, so a result that comes back is one the caller may
// read. A backend implementing this service must therefore assert *who* is calling — and
// nothing more.
service ContextService {
  // Search: return the documents matching the query that the caller may see, with citations.
  rpc Search(SearchRequest) returns (SearchResponse);
}
