syntax = "proto3";

package agentic_mesh_protocol.context.v1;

import "agentic_mesh_protocol/context/v1/context_enums.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// Citation: one document a search returns, with what is needed to point back at it.
//
// A long document yields many passages; the backend collapses them, so a citation is
// one *document*, quoted by the passage that matched it best.
message Citation {
  // Stable identifier of the document in the Context Platform.
  string document_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Title as the source names it now, read from the control plane rather than the index.
  string title = 2;
  // The passage that matched, whole where it fits the backend's budget.
  string snippet = 3;
  // Fused relevance. Comparable only between results of the same response, and NOT a
  // similarity: it is a rank fusion whose ceiling is far below 1. Never show it as a percentage.
  double score = 4;
  // Provider the document came from, e.g. "google_drive" or "notion".
  string source = 5;
  // Where a human can open the document at the provider; empty when the provider offers none.
  string source_url = 6;
  // What kind of passage this is.
  Modality modality = 7;
  // Where the passage sits inside the document, as the backend recorded it (offsets, heading
  // path, page or slide number). Free-form on purpose: it is opaque to the agent and exists so
  // a later context expansion can widen it.
  google.protobuf.Struct locator = 8;
  // Anything else the backend chose to carry. Free-form, and never load-bearing for an agent.
  google.protobuf.Struct metadata = 9;
}
