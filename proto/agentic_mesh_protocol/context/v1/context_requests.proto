syntax = "proto3";

package agentic_mesh_protocol.context.v1;

import "agentic_mesh_protocol/context/v1/context_models.proto";
import "buf/validate/validate.proto";

// SearchRequest: what to look for in the caller's own knowledge.
//
// It carries no identity, deliberately. The organization, the user and the mission are
// derived server-side from the request context, exactly as the storage service does, and the
// Context Platform refuses any identity sent in a request body. An agent therefore cannot
// widen what it may read, by accident or otherwise.
message SearchRequest {
  // The question, in the user's own words.
  string query = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 4000
  ];
  // Restrict the search to these providers, e.g. ["google_drive", "notion"]. Empty = every
  // source the caller has connected. This is what lets a user choose where to look.
  repeated string sources = 2 [(buf.validate.field).repeated.max_items = 16];
  // How many documents to return. 0 = server default (10), capped at 50. These are documents,
  // not passages: several passages of one document count once.
  int32 limit = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 50
  ];
}

// SearchResponse: the documents that answer the query, best first.
message SearchResponse {
  // Citations, most relevant first. Empty when nothing matched, which is an answer and not an error.
  repeated Citation results = 1;
}
