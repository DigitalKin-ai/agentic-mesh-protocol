syntax = "proto3";

package agentic_mesh_protocol.user_profile.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Metadata: Message to represent user metadata (security keys, etc.)
message Metadata {
  // security_key: Security key for the user
  string security_key = 1;
}

// Subscription: Message to represent user subscription information
message Subscription {
  // tier: Subscription tier level
  string tier = 1;
  // status: Current subscription status
  string status = 2;
  // start: Subscription start date
  google.protobuf.Timestamp start = 3;
  // end: Subscription end date
  google.protobuf.Timestamp end = 4;
}

// CreditLot: Message to represent user credit allocation and usage
message CreditLot {
  // source: Source of the credit lot (e.g., "top-up", "subs", "free plan"...)
  string source = 1;
  // total: Total credit lot total to the user
  int64 total = 2;
  // remaining: credit lot remaining by the user
  double remaining = 3;
  // timestamp: Last update timestamp for creditLot
  google.protobuf.Timestamp timestamp = 4;
}

// UserProfile: Message to represent a user profile
message UserProfile {
  // user_id: Unique identifier for the user
  string user_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "users:"
  ];
  // organisation_id: Organization ID linked to the user
  string organisation_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "organisations:"
  ];
  // email: User email address
  string email = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];
  // first_name: User first name
  string first_name = 4 [(buf.validate.field).required = true];
  // last_name: User last name
  string last_name = 5 [(buf.validate.field).required = true];
  // creation_date: Profile creation date
  google.protobuf.Timestamp creation_date = 6 [(buf.validate.field).required = true];
  // update_date: Profile last update date
  google.protobuf.Timestamp update_date = 7 [(buf.validate.field).required = true];
  // locale: User locale preference
  string locale = 8 [(buf.validate.field).required = true];
  // subscription: User subscription information
  Subscription subscription = 9;
  // credits: User credit allocation and usage
  repeated CreditLot credits = 10;
  // metadata: Additional user metadata (preferences, settings, etc.)
  google.protobuf.Struct metadata = 11;
}

// GetUserProfileRequest: Request to get a user profile
message GetUserProfileRequest {
  // mission_id: Unique identifier for the mission
  string mission_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "missions:"
  ];
}

// GetUserProfileResponse: Response after getting a user profile
message GetUserProfileResponse {
  // success: Success of the operation
  bool success = 1 [(buf.validate.field).required = true];
  // user_profile: Retrieved user profile
  UserProfile user_profile = 2 [(buf.validate.field).required = true];
}

// GetSetupSecretRequest
// This request is used to resolve the secret object attached to a setup,
// for the user resolved from the mission.
//
// Fields:
// - setup_id: The unique identifier of the setup whose secrets are resolved.
// - mission_id: The mission scope used to resolve the user the secrets belong to.
message GetSetupSecretRequest {
  // setup_id: The unique identifier of the setup.
  string setup_id = 1 [(buf.validate.field).required = true];
  // mission_id: The mission scope used to resolve the user the secrets belong to.
  string mission_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "missions:"
  ];
}

// GetSetupSecretResponse
// Returns the resolved secret object, conforming to the secret_schema of the
// setup's module (see module.v1 ModuleService.GetModuleSecret).
//
// Fields:
// - success: description flag of the operation.
// - secret: The secret values as a structured object matching the secret_schema.
message GetSetupSecretResponse {
  // success: description flag of the operation.
  bool success = 1;
  // secret: The secret values as a structured object matching the secret_schema.
  google.protobuf.Struct secret = 2 [(buf.validate.field).required = true];
}

// GetSetupUserInfoRequest
// This request is used to retrieve the user information attached to a setup,
// for the user resolved from the mission, needed for a kin to run.
//
// Fields:
// - setup_id: The unique identifier of the setup whose user info is resolved.
// - mission_id: The mission scope used to resolve the user.
message GetSetupUserInfoRequest {
  // setup_id: The unique identifier of the setup.
  string setup_id = 1 [(buf.validate.field).required = true];
  // mission_id: The mission scope used to resolve the user.
  string mission_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "missions:"
  ];
}

// GetSetupUserInfoResponse
// Returns the user information associated with the setup owner.
//
// Fields:
// - success: description flag of the operation.
// - user_info: The user profile information needed for the kin to run.
message GetSetupUserInfoResponse {
  // success: description flag of the operation.
  bool success = 1;
  // secret: The secret values as a structured object matching the secret_schema.
  google.protobuf.Struct secret = 2 [(buf.validate.field).required = true];
}

// ResourceType: Enumerates the kinds of resources whose access can be checked.
// Enum values can be added over time without breaking existing clients.
enum ResourceType {
  // RESOURCE_TYPE_UNSPECIFIED: Default value, must not be used in requests.
  RESOURCE_TYPE_UNSPECIFIED = 0;
  // RESOURCE_TYPE_SETUP: A setup resource (setups:).
  RESOURCE_TYPE_SETUP = 1;
  // RESOURCE_TYPE_MODULE: A module resource (modules:).
  RESOURCE_TYPE_MODULE = 2;
  // RESOURCE_TYPE_MISSION: A mission resource (missions:).
  RESOURCE_TYPE_MISSION = 3;
  // RESOURCE_TYPE_STORAGE_RECORD: A storage record resource.
  RESOURCE_TYPE_STORAGE_RECORD = 4;
  // RESOURCE_TYPE_FILE: A filesystem file resource.
  RESOURCE_TYPE_FILE = 5;
}

// CheckResourceAccessRequest
// This request is used to check whether the calling task is authorized to
// access a given resource.
//
// The task identifier is NOT carried in this message: it is provided through
// the gRPC request metadata (e.g. the "task-id" header) and resolved
// server-side, so authorization context is decoupled from the payload.
//
// Fields:
// - resource_type: The type of the resource whose access is being checked.
// - resource_id: The unique identifier of the resource whose access is being checked.
message CheckResourceAccessRequest {
  // resource_type: The type of the resource whose access is being checked.
  ResourceType resource_type = 1 [(buf.validate.field).required = true];
  // resource_id: The unique identifier of the resource whose access is being checked.
  string resource_id = 2 [(buf.validate.field).required = true];
}

// CheckResourceAccessResponse
// Returns whether the calling task is allowed to access the requested resource.
//
// A denied access is a normal, expected answer and is reported through the
// allowed flag with an OK gRPC status. Non-OK statuses are reserved for actual
// failures (missing task metadata, unknown resource, internal errors).
//
// Fields:
// - allowed: True if the task is authorized to access the resource, false otherwise.
message CheckResourceAccessResponse {
  // allowed: True if the task is authorized to access the resource, false otherwise.
  bool allowed = 1;
}
