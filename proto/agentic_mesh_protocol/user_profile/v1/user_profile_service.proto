syntax = "proto3";

package agentic_mesh_protocol.user_profile.v1;

import "agentic_mesh_protocol/user_profile/v1/user_profile_dto.proto";

// UserProfileService resolves the user a mission runs for, the per-user data of a
// setup, and the access rights of a task.
service UserProfileService {
  // GetUserProfile retrieves the profile of the user a mission runs for.
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  // GetSetupSecret resolves the secret object of a setup, conforming to its module secret_schema.
  rpc GetSetupSecret(GetSetupSecretRequest) returns (GetSetupSecretResponse);
  // GetSetupUserInfo resolves the user information a setup needs to run.
  rpc GetSetupUserInfo(GetSetupUserInfoRequest) returns (GetSetupUserInfoResponse);
  // CheckResourceAccess checks whether the calling task (resolved from the request
  // metadata) may access a resource.
  rpc CheckResourceAccess(CheckResourceAccessRequest) returns (CheckResourceAccessResponse);
}
