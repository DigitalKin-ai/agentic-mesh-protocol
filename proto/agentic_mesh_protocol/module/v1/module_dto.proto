// ═════════════════════════════════ ConfigSetupModule ══════════════════════════════════ //

// ConfigSetupModuleRequest asks a module to compute and store the configuration of a setup version.
message ConfigSetupModuleRequest {
  // mission_id is the mission the configuration runs for.
  string mission_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "missions:"
      min_len: 10
      max_len: 256
    }
  ];

  // setup_version is the setup version to configure.
  agentic_mesh_protocol.setup.v1.SetupVersion setup_version = 2 [(buf.validate.field).required = true];

  // content is the new content to compute and/or configure.
  google.protobuf.Struct content = 3 [(buf.validate.field).required = true];
}

// ConfigSetupModuleResponse returns the configured setup version.
message ConfigSetupModuleResponse {
  // result holds the configured SetupVersion, or an OperationError.
  ModuleResult result = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "config_setup_module_response.outcome"
      message: "result must hold a SetupVersion or an OperationError"
      expression: "has(this.setup_version) || has(this.error)"
    }
  ];
}

// ════════════════════════════════════ StartModule ═════════════════════════════════════ //

// StartModuleRequest starts a job of the module with a setup and an input.
message StartModuleRequest {
  // setup_id is the setup the job runs with.
  string setup_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "setups:"
      min_len: 8
      max_len: 256
    }
  ];

  // mission_id is the mission the job runs for.
  string mission_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "missions:"
      min_len: 10
      max_len: 256
    }
  ];

  // input is the input of the job.
  google.protobuf.Struct input = 3 [(buf.validate.field).required = true];
}

// StartModuleResponse is one message of the job output stream.
message StartModuleResponse {
  // job_id is the unique identifier of the started job.
  string job_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "jobs:"
      min_len: 6
      max_len: 256
    }
  ];

  // result holds one output of the job, or an OperationError.
  ModuleResult result = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "start_module_response.outcome"
      message: "result must hold an output or an OperationError"
      expression: "has(this.output) || has(this.error)"
    }
  ];
}

// ═════════════════════════════════════ StopModule ═════════════════════════════════════ //

// StopModuleRequest stops a running job.
message StopModuleRequest {
  // job_id is the unique identifier of the job to stop.
  string job_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "jobs:"
      min_len: 6
      max_len: 256
    }
  ];
}

// StopModuleResponse returns the stopped job.
message StopModuleResponse {
  // result holds the stopped Job, or an OperationError.
  ModuleResult result = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "stop_module_response.outcome"
      message: "result must hold a Job or an OperationError"
      expression: "has(this.job) || has(this.error)"
    }
  ];
}
