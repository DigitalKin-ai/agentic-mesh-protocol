syntax = "proto3";

package agentic_mesh_protocol.module.v1;

import "agentic_mesh_protocol/module/v1/module_messages.proto";
import "agentic_mesh_protocol/setup/v1/setup_messages.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// ═══════════════════════════════════ GetModuleInput ═══════════════════════════════════ //

// GetModuleInputRequest retrieves the input schema of a module.
message GetModuleInputRequest {
  // module_id is the unique identifier of the module.
  string module_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "modules:"
      min_len: 9
      max_len: 256
    }
  ];

  // llm_format returns the schema in the LLM-friendly format instead of the raw pydantic one.
  bool llm_format = 2;
}

// GetModuleInputResponse returns the input schema of a module.
message GetModuleInputResponse {
  // result holds the schema, or an OperationError.
  ModuleResult result = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "get_module_input_response.outcome"
      message: "result must hold an input_schema or an OperationError"
      expression: "has(this.input_schema) || has(this.error)"
    }
  ];
}

