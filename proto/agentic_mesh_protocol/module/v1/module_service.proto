syntax = "proto3";

package agentic_mesh_protocol.module.v1;

import "agentic_mesh_protocol/module/v1/module_dto.proto";

// ModuleService is served by every module of the mesh: an archetype (kin, the agent
// brain), a tool (a utility the agent calls) or a service. It runs jobs and exposes
// the schemas a caller needs to configure and call the module.
service ModuleService {
  // StartModule starts a job and streams its outputs.
  rpc StartModule(StartModuleRequest) returns (stream StartModuleResponse);
  // StopModule stops a running job.
  rpc StopModule(StopModuleRequest) returns (StopModuleResponse);
  // GetModuleInput returns the input schema.
  rpc GetModuleInput(GetModuleInputRequest) returns (GetModuleInputResponse);
  // GetModuleSelectInput returns the select-input schema.
  rpc GetModuleSelectInput(GetModuleSelectInputRequest) returns (GetModuleSelectInputResponse);
  // GetModuleOutput returns the output schema.
  rpc GetModuleOutput(GetModuleOutputRequest) returns (GetModuleOutputResponse);
  // GetModuleSetup returns the setup schema.
  rpc GetModuleSetup(GetModuleSetupRequest) returns (GetModuleSetupResponse);
  // GetModuleSecret returns the secret schema.
  rpc GetModuleSecret(GetModuleSecretRequest) returns (GetModuleSecretResponse);
  // GetModuleUserInfo returns the user-info schema.
  rpc GetModuleUserInfo(GetModuleUserInfoRequest) returns (GetModuleUserInfoResponse);
  // GetConfigSetupModule returns the config-setup schema.
  rpc GetConfigSetupModule(GetConfigSetupModuleRequest) returns (GetConfigSetupModuleResponse);
  // ConfigSetupModule computes and stores the configuration of a setup version.
  rpc ConfigSetupModule(ConfigSetupModuleRequest) returns (ConfigSetupModuleResponse);
  // GetModuleCost returns the cost configuration schema.
  rpc GetModuleCost(GetModuleCostRequest) returns (GetModuleCostResponse);
}
