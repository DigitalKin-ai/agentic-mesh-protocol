syntax = "proto3";

package agentic_mesh_protocol.module.v1;

import "agentic_mesh_protocol/module/v1/module_enums.proto";
import "agentic_mesh_protocol/pagination/v1/bulk.proto";
import "agentic_mesh_protocol/setup/v1/setup_messages.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// ═════════════════════════════════════ Objects ════════════════════════════════════ //

// Job is an execution of a module.
message Job {
  // job_id is the unique identifier of the job.
  string job_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "jobs:"
      min_len: 6
      max_len: 256
    }
  ];

  // status is the lifecycle status of the job.
  JobStatus status = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// ModuleResult is the outcome of an operation on a module.
message ModuleResult {
  // identifier is the identifier of the processed item (the module id, or the job id).
  string identifier = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256
  ];

  // outcome holds the operation result, or the error that prevented it.
  oneof outcome {
    option (buf.validate.oneof).required = true;
    // input_schema is the input schema of the module.
    google.protobuf.Struct input_schema = 2;
    // select_input_schema is the select-input schema of the module.
    google.protobuf.Struct select_input_schema = 3;
    // output_schema is the output schema of the module.
    google.protobuf.Struct output_schema = 4;
    // setup_schema is the setup schema of the module.
    google.protobuf.Struct setup_schema = 5;
    // secret_schema is the secret schema of the module.
    google.protobuf.Struct secret_schema = 6;
    // user_info_schema is the user-info schema of the module.
    google.protobuf.Struct user_info_schema = 7;
    // config_setup_schema is the config-setup schema of the module.
    google.protobuf.Struct config_setup_schema = 8;
    // cost_schema is the cost configuration schema of the module.
    google.protobuf.Struct cost_schema = 9;
    // output is one output of a running job.
    google.protobuf.Struct output = 10;
    // setup_version is the configured setup version.
    agentic_mesh_protocol.setup.v1.SetupVersion setup_version = 11;
    // job is the job targeted by the operation.
    Job job = 12;
    // error describes why the operation failed.
    agentic_mesh_protocol.pagination.v1.OperationError error = 13;
  }
}
