syntax = "proto3";

package agentic_mesh_protocol.module.v1;

import "agentic_mesh_protocol/pagination/v1/bulk.proto";
import "agentic_mesh_protocol/setup/v1/setup_messages.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// ModuleResult represents the result of a module operation, including success or error information.
message ModuleResult {
  // identifier is the unique identifier for the item being processed
  string identifier = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // success indicates if the operation was successful (optional for backward compatibility).
  optional bool success = 2 [(buf.validate.field).required = false];

  // One of the following fields will be set based on the outcome of processing the item.
  oneof outcom {
    // input_schema is the input schema of the module.
    google.protobuf.Struct input_schema = 3;
    // output_schema is the output schema of the module.
    google.protobuf.Struct output_schema = 4;
    // setup_schema is the setup schema of the module.
    google.protobuf.Struct setup_schema = 5;
    // secret_schema is the secret schema of the module.
    google.protobuf.Struct secret_schema = 6;
    // cost_schema is the cost schema of the module.
    google.protobuf.Struct cost_schema = 7;
    // config_setup_schema is the config setup schema of the module.
    google.protobuf.Struct config_setup_schema = 8;
    // select_input_schema of the module
    google.protobuf.Struct select_input_schema = 9;
    // output is the output data of the module execution.
    google.protobuf.Struct output = 10;
    // setup_version is the setup version if the operation was successful.
    agentic_mesh_protocol.setup.v1.SetupVersion setup_version = 11;
    // error represents the error that occurred while processing the item, if applicable.
    agentic_mesh_protocol.pagination.v1.OperationError error = 12;
  }
}
