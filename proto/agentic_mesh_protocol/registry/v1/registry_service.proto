syntax = "proto3";

package agentic_mesh_protocol.registry.v1;

import "agentic_mesh_protocol/registry/v1/registry_dto.proto";

// RegistryService is the entry point for modules to register themselves and for
// agents to discover the modules and setups of the mesh.
service RegistryService {
  // RegisterModule is called by a module at startup to declare itself in the mesh.
  rpc RegisterModule(RegisterModuleRequest) returns (RegisterModuleResponse);
  // Heartbeat signals that a module is alive.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // SearchSetups searches the setup catalog; resolve a result with GetSetup before invoking it.
  rpc SearchSetups(SearchSetupsRequest) returns (SearchSetupsResponse);
  // SearchModules searches the module catalog; resolve a result with GetModule before calling it.
  rpc SearchModules(SearchModulesRequest) returns (SearchModulesResponse);
  // GetSetup resolves a setup into its complete descriptor (configuration + module endpoint).
  rpc GetSetup(GetSetupRequest) returns (GetSetupResponse);
  // GetModule resolves a module into its complete descriptor.
  rpc GetModule(GetModuleRequest) returns (GetModuleResponse);
  // GetModuleStatus retrieves the availability of a module.
  rpc GetModuleStatus(GetModuleStatusRequest) returns (GetModuleStatusResponse);
}
