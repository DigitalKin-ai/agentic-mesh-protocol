syntax = "proto3";

package agentic_mesh_protocol.registry.v1;

import "agentic_mesh_protocol/registry/v1/registry_enums.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// -------------------------
// DOMAIN MODELS
// -------------------------

// Represents your "modules" table as seen by the network.
message ModuleDescriptor {
  // ID
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "modules:",
    (buf.validate.field).string.min_len = 1
  ]; // SurrealDB module id
  // Name
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Module type
  ModuleType module_type = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // Version
  string version = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Network endpoint
  // Address used to communicate with the module
  string address = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ]; // host or IP
  // Port used to communicate with the module
  int32 port = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 65535
  ];

  // Status
  ModuleStatus status = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // Visibility
  Visibility visibility = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.not_in = 0
  ];

  // Organization ID
  string organization_id = 9 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "organizations:",
    (buf.validate.field).string.min_len = 1
  ];
  // Owner ID
  string owner_id = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "users:",
    (buf.validate.field).string.min_len = 1
  ];

  // Schemas for machine introspection
  // Input schema
  google.protobuf.Struct input_schema = 11 [(buf.validate.field).required = true];
  // Output schema
  google.protobuf.Struct output_schema = 12 [(buf.validate.field).required = true];
  // Setup schema
  google.protobuf.Struct setup_schema = 13 [(buf.validate.field).required = true];
  // Secret schema
  google.protobuf.Struct secret_schema = 14 [(buf.validate.field).required = true];
  // Cost schema
  google.protobuf.Struct cost_schema = 15 [(buf.validate.field).required = true];

  // Documentation (may be empty)
  string documentation = 16;

  // Created at
  google.protobuf.Timestamp created_at = 17 [(buf.validate.field).required = true];
  // Updated at
  google.protobuf.Timestamp updated_at = 18 [(buf.validate.field).required = true];

  // Tags for categorization and search filtering (lowercase recommended)
  repeated string tags = 19 [
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}

// Represents your "setups" + current "setup_versions"
message SetupDescriptor {
  // ID
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "setups:",
    (buf.validate.field).string.min_len = 1
  ];
  // Name
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Documentation (may be empty)
  string documentation = 3;
  // Status
  SetupStatus status = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // Visibility
  Visibility visibility = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // Organization ID
  string organization_id = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "organizations:",
    (buf.validate.field).string.min_len = 1
  ];
  // Owner ID
  string owner_id = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "users:",
    (buf.validate.field).string.min_len = 1
  ];
  // Card ID
  string card_id = 8 [
    (buf.validate.field).string.prefix = "cards:",
    (buf.validate.field).string.min_len = 1
  ];

  // Link to the module
  string module_id = 9 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "modules:",
    (buf.validate.field).string.min_len = 1
  ];

  // Current version (setup_versions)
  // ID
  string setup_version_id = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "setup_versions:",
    (buf.validate.field).string.min_len = 1
  ];
  // Version
  string setup_version = 11 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Configuration
  google.protobuf.Struct config = 12 [(buf.validate.field).required = true];

  // Resolved module info (so agents don't need another round-trip)
  ModuleDescriptor module = 13 [(buf.validate.field).required = true];

  // Tags for categorization and search filtering (lowercase recommended)
  repeated string tags = 14 [
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}

// Trimmed, search-oriented view of a module. Intentionally excludes the
// network address/port (mesh-internal) and the schema Structs — resolve
// via GetModule when wiring communication.
message ModuleSummary {
  // Module ID
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "modules:",
    (buf.validate.field).string.min_len = 1
  ];
  // Name
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Module type (tool vs archetype/kin)
  ModuleType module_type = 3;
  // Version
  string version = 4;
  // Status
  ModuleStatus status = 5;
  // Visibility
  Visibility visibility = 6;
  // Organization ID
  string organization_id = 7;
  // Documentation
  string documentation = 8;
  // Tags
  repeated string tags = 9;
}

// Trimmed, search-oriented view of a setup. Intentionally excludes the
// setup configuration (may contain sensitive values), owner/card ids and
// the full module descriptor — resolve via GetSetup when invoking.
message SetupSummary {
  // Setup ID
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "setups:",
    (buf.validate.field).string.min_len = 1
  ];
  // Name
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Documentation
  string documentation = 3;
  // Status
  SetupStatus status = 4;
  // Visibility
  Visibility visibility = 5;
  // Organization ID
  string organization_id = 6;
  // Backing module
  string module_id = 7;
  // Backing module name (denormalized so search needs no second round-trip)
  string module_name = 8;
  // Backing module type (tool vs archetype/kin)
  ModuleType module_type = 9;
  // Current version id
  string setup_version_id = 10;
  // Current version label
  string setup_version = 11;
  // Tags
  repeated string tags = 12;
}
