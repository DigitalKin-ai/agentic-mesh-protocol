    (buf.validate.field).string = {
      prefix: "setups:"
      min_len: 8
      max_len: 256
    }
  ];
}

// GetSetupResponse returns the complete descriptor of the setup.
message GetSetupResponse {
  // result holds the SetupDescriptor, or an OperationError.
  RegistryResult result = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "get_setup_response.outcome"
      message: "result must hold a SetupDescriptor or an OperationError"
      expression: "has(this.setup_descriptor) || has(this.error)"
    }
  ];
}

