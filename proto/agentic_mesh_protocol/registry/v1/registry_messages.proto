syntax = "proto3";

package agentic_mesh_protocol.registry.v1;

import "agentic_mesh_protocol/module/v1/module_enums.proto";
import "agentic_mesh_protocol/pagination/v1/bulk.proto";
import "agentic_mesh_protocol/registry/v1/registry_enums.proto";
import "agentic_mesh_protocol/setup/v1/setup_enums.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ModuleDescriptor represents a module's complete descriptor as seen by the network.
message ModuleDescriptor {
  option (buf.validate.message).cel = {
    id: "created_at_after_updated_at"
    expression: "!has(this.created_at) || !has(this.updated_at) || this.created_at <= this.updated_at"
    message: "created_at must be before or equal to updated_at"
  };
  option (buf.validate.message).cel = {
    id: "updated_at_before_updated_at"
    expression: "!has(this.updated_at) || !has(this.created_at) || this.updated_at >= this.created_at"
    message: "updated_at must be after or equal to created_at"
  };

  // id is the unique identifier of the module (SurrealDB format).
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "module_id_prefix"
      expression: "this.startsWith('modules:')"
      message: "module_id must start with 'modules:'"
    },
    (buf.validate.field).cel = {
      id: "module_id_length"
      expression: "this.size() >= 9"
      message: "module_id must be at least 1 characters long"
    }
  ]; // SurrealDB module id
  // organization_id is the unique identifier of the organization that owns this module.
  string organization_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "organization_id_prefix"
      expression: "this.startsWith('organizations:')"
      message: "organization_id must start with 'organizations:'"
    },
    (buf.validate.field).cel = {
      id: "organization_id_length"
      expression: "this.size() >= 15"
      message: "organization_id must be at least 1 characters long"
    }
  ];
  // owner_id is the unique identifier of the user who owns this module.
  string owner_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "user_id_prefix"
      expression: "this.startsWith('users:')"
      message: "user_id must start with 'users:'"
    },
    (buf.validate.field).cel = {
      id: "user_id_length"
      expression: "this.size() >= 7"
      message: "user_id must be at least 1 characters long"
    }
  ];
  // name is the human-readable name of the module.
  string name = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // version is the runtime version of the deployed module.
  string version = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // address is the network endpoint URI used to communicate with the module.
  string address = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true,
    (buf.validate.field).string.min_len = 1
  ];
  // documentation is the module's documentation or description.
  string documentation = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // port is the network port used to communicate with the module.
  int32 port = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 65535
    }
  ];
  // type is the module type classification (e.g., ARCHETYPE, TOOL).
  agentic_mesh_protocol.module.v1.ModuleType type = 9 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // status is the current status of the module (e.g., READY, ACTIVE).
  agentic_mesh_protocol.module.v1.ModuleStatus status = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // visibility defines who can access this module (e.g., PUBLIC, PRIVATE).
  Visibility visibility = 11 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // created_at is the timestamp when the module was created.
  google.protobuf.Timestamp created_at = 12 [(buf.validate.field).required = true];
  // updated_at is the timestamp when the module was last updated.
  google.protobuf.Timestamp updated_at = 13 [(buf.validate.field).required = true];
  // input_schema is the JSON schema defining the module's expected input format.
  google.protobuf.Struct input_schema = 14 [(buf.validate.field).required = true];
  // output_schema is the JSON schema defining the module's output format.
  google.protobuf.Struct output_schema = 15 [(buf.validate.field).required = true];
  // setup_schema is the JSON schema defining the module's setup configuration.
  google.protobuf.Struct setup_schema = 16 [(buf.validate.field).required = true];
  // secret_schema is the JSON schema defining the module's secret configuration.
  google.protobuf.Struct secret_schema = 17 [(buf.validate.field).required = true];
  // cost_schema is the JSON schema defining the module's cost structure.
  google.protobuf.Struct cost_schema = 18 [(buf.validate.field).required = true];
}

// SetupDescriptor represents a setup's complete descriptor including its current version.
message SetupDescriptor {
  // id is the unique identifier of the setup.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "setup_id_prefix"
      expression: "this.startsWith('setups:')"
      message: "setup_id must start with 'setups:'"
    },
    (buf.validate.field).cel = {
      id: "setup_id_length"
      expression: "this.size() >= 8"
      message: "setup_id must be at least 1 characters long"
    }
  ];
  // organization_id is the unique identifier of the organization that owns this setup.
  string organization_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "organization_id_prefix"
      expression: "this.startsWith('organizations:')"
      message: "organization_id must start with 'organizations:'"
    },
    (buf.validate.field).cel = {
      id: "organization_id_length"
      expression: "this.size() >= 15"
      message: "organization_id must be at least 1 characters long"
    }
  ];
  // owner_id is the unique identifier of the user who owns this setup.
  string owner_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "user_id_prefix"
      expression: "this.startsWith('users:')"
      message: "user_id must start with 'users:'"
    },
    (buf.validate.field).cel = {
      id: "user_id_length"
      expression: "this.size() >= 7"
      message: "user_id must be at least 1 characters long"
    }
  ];
  // card_id is the unique identifier of the card associated with this setup.
  string card_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "card_id_prefix"
      expression: "this.startsWith('cards:')"
      message: "card_id must start with 'cards:'"
    },
    (buf.validate.field).cel = {
      id: "card_id_length"
      expression: "this.size() >= 7"
      message: "card_id must be at least 1 characters long"
    }
  ];
  // module_id is the unique identifier of the module linked to this setup.
  string module_id = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "module_id_prefix"
      expression: "this.startsWith('modules:')"
      message: "module_id must start with 'modules:'"
    },
    (buf.validate.field).cel = {
      id: "module_id_length"
      expression: "this.size() >= 9"
      message: "module_id must be at least 1 characters long"
    }
  ];
  // setup_version_id is the unique identifier of the current active setup version.
  string setup_version_id = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "setup_version_id_prefix"
      expression: "this.startsWith('setup_versions:')"
      message: "setup_version_id must start with 'setup_versions:'"
    },
    (buf.validate.field).cel = {
      id: "setup_version_id_length"
      expression: "this.size() >= 16"
      message: "setup_version_id must be at least 1 characters long"
    }
  ];
  // name is the human-readable name of the setup.
  string name = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // documentation is the setup's documentation or description.
  string documentation = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // setup_version is the version label of the current active setup version.
  string setup_version = 9 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // status is the current status of the setup (e.g., READY, DRAFT).
  agentic_mesh_protocol.setup.v1.SetupStatus status = 10 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // visibility defines who can access this setup (e.g., PUBLIC, PRIVATE).
  Visibility visibility = 11 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // config contains the configuration key-value pairs for this setup.
  google.protobuf.Struct config = 12 [(buf.validate.field).required = true];
  // module contains the resolved module descriptor for this setup.
  ModuleDescriptor module = 13 [(buf.validate.field).required = true];
}

// RegistryResult represents the result of a registry operation, including success or error information.
message RegistryResult {
  // identifier is the unique identifier for the item being processed
  string identifier = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // success indicates if the operation was successful (optional for backward compatibility).
  optional bool success = 2 [(buf.validate.field).required = false];

  // One of the following fields will be set based on the outcome of processing the item.
  oneof outcom {
    // module_descriptor is the module descriptor if the operation was successful.
    ModuleDescriptor module_descriptor = 3;
    // setup_descriptor is the setup descriptor if the operation was successful.
    SetupDescriptor setup_descriptor = 4;
    // error represents the error that occurred while processing the item, if applicable.
    agentic_mesh_protocol.pagination.v1.OperationError error = 5;
  }
}
