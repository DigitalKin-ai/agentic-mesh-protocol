syntax = "proto3";

package agentic_mesh_protocol.graph.v1;

import "agentic_mesh_protocol/graph/v1/graph_admin_dto.proto";

// GraphAdminService is the internal maintenance surface of the graph microservice (purge,
// departure rule, rebuild, health, migration). Reached by the back's jobs and by operators only,
// never registered in the services provider.
service GraphAdminService {
  // PurgeContext purges every graph of one context.
  rpc PurgeContext(PurgeContextRequest) returns (PurgeContextResponse);
  // PurgeOrganization purges every graph of one organization.
  rpc PurgeOrganization(PurgeOrganizationRequest) returns (PurgeOrganizationResponse);
  // ReleaseUserGraphs applies the departure rule to the graphs of a user in one organization.
  rpc ReleaseUserGraphs(ReleaseUserGraphsRequest) returns (ReleaseUserGraphsResponse);
  // RebuildIndex rebuilds the engine index from snapshots and the journal.
  rpc RebuildIndex(RebuildIndexRequest) returns (RebuildIndexResponse);
  // GetShardHealth reads the health of every shard.
  rpc GetShardHealth(GetShardHealthRequest) returns (GetShardHealthResponse);
  // AdoptStorageGraph migrates one tool-rdf-kg Storage record into the service.
  rpc AdoptStorageGraph(AdoptStorageGraphRequest) returns (AdoptStorageGraphResponse);
}
