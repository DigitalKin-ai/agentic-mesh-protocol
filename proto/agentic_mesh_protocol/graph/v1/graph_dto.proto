// ════════════════════════════════════ ListVersions ════════════════════════════════════ //

// ListVersionsRequest lists the version history of a graph.
message ListVersionsRequest {
  option (buf.validate.message).cel = {
    id: "list_versions_request.receipts_page_size"
    message: "with include_receipts, pagination.limit must be set and at most 10"
