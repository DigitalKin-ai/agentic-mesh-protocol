  }
}

// ════════════════════════════════════ PinOntology ════════════════════════════════════ //

// PinOntologyRequest stores a strict ontology in the caller's organization, content-addressed
// by its canonical sha256.
message PinOntologyRequest {
  // expected_sha256 is the canonical sha256 the caller expects (refused on mismatch).
