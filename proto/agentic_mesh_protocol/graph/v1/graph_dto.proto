    // file_id is a Filesystem file the caller may read.
    string file_id = 4 [(buf.validate.field).string = {
      prefix: "files:"
      min_len: 7
      max_len: 256
    }];
  }
}

// PinOntologyResult is a pinned ontology.
message PinOntologyResult {
  // ontology is the pinned ontology.
