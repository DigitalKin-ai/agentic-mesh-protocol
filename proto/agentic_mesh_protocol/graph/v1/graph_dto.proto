// ════════════════════════════════════ GetOntology ════════════════════════════════════ //

// GetOntologyRequest reads a pinned ontology.
message GetOntologyRequest {
  // sha256 is the ontology.
  string sha256 = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9a-f]{64}$"
  ];

  // include_content adds the document.
  bool include_content = 2;

  // format is the serialization of the content.
  RdfFormat format = 3 [(buf.validate.field).enum.defined_only = true];
}

// OntologyDocument is a pinned ontology with its content.
message OntologyDocument {
  // ontology is the ontology.
  OntologyRef ontology = 1 [(buf.validate.field).required = true];

  // content is the document (include_content), at most 3.5 MiB (a larger ontology is read with Export).
  bytes content = 2 [(buf.validate.field).bytes.max_len = 3670016];
}

// GetOntologyResponse returns the ontology, or why it was refused.
message GetOntologyResponse {
  // outcome is the result, or why the call was refused.
  oneof outcome {
    option (buf.validate.oneof).required = true;
    // document is the ontology.
    OntologyDocument document = 1;
    // error is why the call was refused (nothing was written).
    GraphError error = 2;
  }
}

// ════════════════════════════════════ RegisterGates ════════════════════════════════════ //

// RegisterGatesRequest registers a custom gate set in the caller's organization.
message RegisterGatesRequest {
  option (buf.validate.message).cel = {
    id: "register_gates.unique_ids"
    message: "gate ids must be unique"
    expression: "this.gates.map(g, g.gate_id).unique()"
  };

  // gates are checked at registration (parse, form, function matrix, budget, vocabulary of
  // ontology_sha256).
  repeated GateDefinition gates = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];

  // ontology_sha256 is the ontology the gates are checked against; empty = open mode.
  optional string ontology_sha256 = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
}

// GateSet is a set of gates: built-ins and/or one registered set (one page for ListGates).
message GateSet {
  // gates are the gates (scope class and sha filled).
  repeated GateDefinition gates = 1 [(buf.validate.field).repeated.max_items = 64];

  // gate_set_sha256 identifies the registered set (absent = built-ins only).
  optional string gate_set_sha256 = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];

  // pagination is the page information (ListGates only).
  agentic_mesh_protocol.pagination.v1.PaginationResponse pagination = 3;
}

// RegisterGatesResponse returns the registered set, or why it was refused.
message RegisterGatesResponse {
  // outcome is the result, or why the call was refused.
  oneof outcome {
    option (buf.validate.oneof).required = true;
    // gate_set is the registered set.
    GateSet gate_set = 1;
    // error is why the call was refused (nothing was written).
    GraphError error = 2;
  }
}

// ════════════════════════════════════ ListGates ════════════════════════════════════ //

// ListGatesRequest lists built-in gates and/or the gates of one registered set.
message ListGatesRequest {
  option (buf.validate.message).cel = {
    id: "list_gates_request.page_size"
    message: "pagination.limit must be at most 50"
    expression: "!has(this.pagination) || this.pagination.limit <= 50"
  };

  // include_builtins adds the built-in gates.
  bool include_builtins = 1;

  // stage filters on a stage.
  GateStage stage = 2 [(buf.validate.field).enum.defined_only = true];

  // schema_mode filters the built-ins of a mode.
  SchemaMode schema_mode = 3 [(buf.validate.field).enum.defined_only = true];

  // gate_set_sha256 is a registered set; empty = built-ins only.
  optional string gate_set_sha256 = 4 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];

  // graph lists the gates in effect on that graph (built-ins of its mode + its bound set).
  GraphRef graph = 5;

  // sparql_sha256s fetches gates by the sha recorded in a verdict, including built-in versions
  // that are no longer current, so an old verdict can be replayed.
  repeated string sparql_sha256s = 6 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {pattern: "^[0-9a-f]{64}$"}
    }
  }];

  // pagination is the page (default order: gate_id; at most 50 gates a page).
  agentic_mesh_protocol.pagination.v1.PaginationRequest pagination = 7;
}

// ListGatesResponse returns the gates, or why the listing was refused.
message ListGatesResponse {
  // outcome is the result, or why the call was refused.
  oneof outcome {
    option (buf.validate.oneof).required = true;
    // gate_set is the gates listed.
    GateSet gate_set = 1;
    // error is why the call was refused (nothing was written).
    GraphError error = 2;
  }
}

