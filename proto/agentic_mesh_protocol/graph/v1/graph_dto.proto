// ════════════════════════════════════ SetGraphAcl ════════════════════════════════════ //

// SetGraphAclRequest replaces the active entries of a graph ACL.
message SetGraphAclRequest {
  option (buf.validate.message).cel = {
    id: "set_graph_acl_request.visibility_users_only"
    message: "visibility can only be chosen for a USERS graph"
    expression: "this.ref.scope == 3 || this.visibility == 0"
  };
  option (buf.validate.message).cel = {
    id: "set_graph_acl_request.users_not_public"
    message: "a USERS graph cannot be PUBLIC"
    expression: "this.ref.scope != 3 || this.visibility != 1"
  };
  option (buf.validate.message).cel = {
    id: "set_graph_acl_request.unique_entries"
    message: "an entry (subject, action) may appear only once"
    expression: "this.entries.map(e, e.user_id + '|' + e.org_id + '|' + string(e.role) + '|' + string(e.action)).unique()"
  };

  // ref names the graph.
  GraphRef ref = 1 [(buf.validate.field).required = true];

  // visibility is the new read rule (UNSPECIFIED = unchanged).
  agentic_mesh_protocol.common.v1.Visibility visibility = 2 [(buf.validate.field).enum.defined_only = true];

  // entries are the desired ACTIVE entries (subject + action); entries no longer listed become
  // ENTRY_REVOKED.
  repeated AclEntry entries = 3 [(buf.validate.field).repeated.max_items = 64];

  // expected_acl_version is the compare-and-set token (GraphAcl.acl_version).
  int64 expected_acl_version = 4 [(buf.validate.field).int64.gte = 1];

  // idempotency_key makes a retry after a lost response return the stored result instead of
  // failing on a moved acl_version.
  string idempotency_key = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 16
      max_len: 128
    }
  ];
}

// SetGraphAclResponse returns the ACL, or why the call was refused.
message SetGraphAclResponse {
  // outcome is the result, or why the call was refused.
  oneof outcome {
    option (buf.validate.oneof).required = true;
    // acl is the ACL.
    GraphAcl acl = 1;
    // error is why the call was refused (nothing was written).
    GraphError error = 2;
  }
}

