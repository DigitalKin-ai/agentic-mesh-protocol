// ════════════════════════════════════ SetGraphRules ════════════════════════════════════ //

// SetGraphRules binds another ontology and/or gate set to an existing graph (e.g. a new version
// of the client's schema). The whole graph is audited against the new rules first: it passes and
// a RULES version is minted, or nothing changes and the outcome is a GATE_VIOLATION error with the
// report. The schema mode never changes in place: an OPEN graph becomes STRICT only through an
// Import REPLACE into a new strict graph, so an ontology on an OPEN graph is refused
// (SCHEMA_MODE_MISMATCH), and a STRICT graph always keeps an ontology.
message SetGraphRulesRequest {
  option (buf.validate.message).cel = {
    id: "set_graph_rules_request.not_empty"
    message: "set ontology_sha256, gate_set_sha256 or clear_gate_set"
    expression: "has(this.ontology_sha256) || has(this.gate_set_sha256) || this.clear_gate_set"
  };
  option (buf.validate.message).cel = {
    id: "set_graph_rules_request.gate_set_or_clear"
    message: "set gate_set_sha256 or clear_gate_set, not both"
    expression: "!(has(this.gate_set_sha256) && this.clear_gate_set)"
  };

  // ref names the graph.
  GraphRef ref = 1 [(buf.validate.field).required = true];

  // ontology_sha256 is the new ontology, pinned in the caller's organization (absent = unchanged).
  optional string ontology_sha256 = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];

  // gate_set_sha256 is the new gate set, registered in the caller's organization (absent = unchanged).
  optional string gate_set_sha256 = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];

  // expected_version is the head the caller expects (compare-and-set).
  int64 expected_version = 4 [(buf.validate.field).int64.gte = 1];

  // idempotency_key makes a retry return the stored outcome.
  string idempotency_key = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 16
      max_len: 128
    }
  ];

  // dry_run runs the audit only; nothing is bound.
  bool dry_run = 6;

  // provenance is stored with the version.
  WriteProvenance provenance = 7;

  // clear_gate_set unbinds the gate set: only the built-ins of the graph's mode remain.
  bool clear_gate_set = 8;
}

// SetGraphRulesResponse returns the RULES version, or why the new rules were refused.
message SetGraphRulesResponse {
  // outcome is the result, or why the call was refused.
  oneof outcome {
    option (buf.validate.oneof).required = true;
    // result is the write result (graph with its new bindings, audit report, version).
    WriteResult result = 1;
    // error is why the call was refused (nothing was written).
    GraphError error = 2;
  }
}

// ════════════════════════════════════ GetQuerySet ════════════════════════════════════ //

