  GraphRef ref = 1 [(buf.validate.field).required = true];

  // pagination is the page (default order: version descending).
  agentic_mesh_protocol.pagination.v1.PaginationRequest pagination = 2;

  // snapshots_only keeps the snapshotted versions only.
  bool snapshots_only = 3;

  // include_receipts adds the verdict receipt of each version.
  bool include_receipts = 4;
}

// VersionPage is a page of versions.
message VersionPage {
  // versions are the versions of the page.
  repeated VersionInfo versions = 1 [(buf.validate.field).repeated.max_items = 100];

  // pagination is the page information.
  agentic_mesh_protocol.pagination.v1.PaginationResponse pagination = 2;

