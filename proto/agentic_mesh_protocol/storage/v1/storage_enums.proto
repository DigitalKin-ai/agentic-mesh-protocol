syntax = "proto3";

package agentic_mesh_protocol.storage.v1;

// DataType is the category of a stored record.
enum DataType {
  // DATA_TYPE_UNSPECIFIED indicates that the data type is not set.
  DATA_TYPE_UNSPECIFIED = 0;
  // OUTPUT: data generated by the system as output.
  OUTPUT = 1;
  // VIEW: data intended for display.
  VIEW = 2;
  // LOGS: log entries and debugging information.
  LOGS = 3;
  // OTHER: any other data.
  OTHER = 4;
}

// StorageContext is the kind of context a record is scoped to. The matching
// identifier is resolved server-side from the task metadata, never sent by the caller.
enum StorageContext {
  // STORAGE_CONTEXT_UNSPECIFIED indicates that the context is not set.
  STORAGE_CONTEXT_UNSPECIFIED = 0;
  // MISSIONS: the record belongs to the mission of the task.
  MISSIONS = 1;
  // SETUP_VERSIONS: the record belongs to the setup version of the task.
  SETUP_VERSIONS = 2;
  // USERS: the record belongs to the user of the task.
  USERS = 3;
  // ORGANIZATIONS: the record belongs to the organization of the task.
  ORGANIZATIONS = 4;
}
