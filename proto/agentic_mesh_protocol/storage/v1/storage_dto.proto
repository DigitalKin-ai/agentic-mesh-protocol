syntax = "proto3";

package agentic_mesh_protocol.storage.v1;

import "agentic_mesh_protocol/pagination/v1/bulk.proto";
import "agentic_mesh_protocol/pagination/v1/pagination.proto";
import "agentic_mesh_protocol/storage/v1/storage_enums.proto";
import "agentic_mesh_protocol/storage/v1/storage_messages.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// ════════════════════════════════════ StoreRecord ════════════════════════════════════ //
message CreateRecordRequest {
  // mission_id is the unique identifier of the mission.
  string mission_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "missions_id_prefix"
      expression: "this.startsWith('missions:')"
      message: "missions_id must start with 'missions:'"
    },
    (buf.validate.field).cel = {
      id: "missions_id_length"
      expression: "this.size() >= 9"
      message: "missions_id must be at least 1 characters long"
    }
  ];

  // collection is the name of the group for the records.
  string collection = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // record_id is the unique identifier for the record within the collection.
  string record_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // data_type is the category of the data being stored.
  DataType data_type = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // data is the JSON object to store.
  google.protobuf.Struct data = 5 [(buf.validate.field).required = true];
}

// Response message for StoreRecord operation.
message CreateRecordResponse {
  // Result of the operation. Expected oneof type: StorageRecord or OperationError.
  StorageResult result = 1 [(buf.validate.field).required = true];
}

