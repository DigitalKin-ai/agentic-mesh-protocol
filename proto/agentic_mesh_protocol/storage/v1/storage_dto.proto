syntax = "proto3";

package agentic_mesh_protocol.storage.v1;

import "agentic_mesh_protocol/common/v1/common_enums.proto";
import "agentic_mesh_protocol/pagination/v1/bulk.proto";
import "agentic_mesh_protocol/pagination/v1/pagination.proto";
import "agentic_mesh_protocol/storage/v1/storage_enums.proto";
import "agentic_mesh_protocol/storage/v1/storage_messages.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// ════════════════════════════════════ CreateRecord ════════════════════════════════════ //

// CreateRecordRequest stores a new record.
message CreateRecordRequest {
  // context is the kind of context the record is scoped to.
  StorageContext context = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // collection is the name of the group of records (unique within the context).
  string collection = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];

  // record_id is the identifier of the record within its collection.
  string record_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];

  // data_type is the category of the data.
  DataType data_type = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // data is the JSON document to store.
  google.protobuf.Struct data = 5 [(buf.validate.field).required = true];

  // visibility is the read-access scope of the record (UNSPECIFIED = server default).
  agentic_mesh_protocol.common.v1.Visibility visibility = 6 [(buf.validate.field).enum.defined_only = true];
}

// CreateRecordResponse returns the stored record.
message CreateRecordResponse {
  // result holds the stored StorageRecord, or an OperationError.
  StorageResult result = 1 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ GetRecord ════════════════════════════════════ //

// GetRecordRequest retrieves a record.
message GetRecordRequest {
  // context is the kind of context the record is scoped to.
  StorageContext context = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // collection is the name of the group of records.
  string collection = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];

  // record_id is the identifier of the record within its collection.
  string record_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];

  // storage_id pins the lookup to one stored record (absent = resolved from the context).
  optional string storage_id = 4 [(buf.validate.field).string = {
    prefix: "storage:"
    min_len: 9
    max_len: 256
  }];
}

// GetRecordResponse returns the requested record.
message GetRecordResponse {
  // result holds the StorageRecord, or an OperationError.
  StorageResult result = 1 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ UpdateRecord ════════════════════════════════════ //

// UpdateRecordRequest overwrites the data of an existing record.
message UpdateRecordRequest {
  // context is the kind of context the record is scoped to.
  StorageContext context = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // collection is the name of the group of records.
  string collection = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];

  // record_id is the identifier of the record within its collection.
  string record_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];

  // data is the new JSON document.
  google.protobuf.Struct data = 4 [(buf.validate.field).required = true];

  // visibility is the new read-access scope (UNSPECIFIED = keep the current one).
  agentic_mesh_protocol.common.v1.Visibility visibility = 5 [(buf.validate.field).enum.defined_only = true];
}

// UpdateRecordResponse returns the updated record.
message UpdateRecordResponse {
  // result holds the updated StorageRecord, or an OperationError.
  StorageResult result = 1 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ DeleteRecord ════════════════════════════════════ //

// DeleteRecordRequest deletes a record.
message DeleteRecordRequest {
  // context is the kind of context the record is scoped to.
  StorageContext context = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // collection is the name of the group of records.
  string collection = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];

  // record_id is the identifier of the record within its collection.
  string record_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];
}

// DeleteRecordResponse returns the deleted record.
message DeleteRecordResponse {
  // result holds the deleted StorageRecord, or an OperationError.
  StorageResult result = 1 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ ListRecords ════════════════════════════════════ //

// ListRecordsRequest lists the records of a collection.
message ListRecordsRequest {
  // context is the kind of context the records are scoped to.
  StorageContext context = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // collection is the name of the group of records.
  string collection = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];

  // visibilities keeps the records carrying one of these scopes (empty = no filter).
  repeated agentic_mesh_protocol.common.v1.Visibility visibilities = 3 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];

  // record_id keeps the records carrying this identifier (absent = no filter).
  optional string record_id = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // pagination selects the page to return (absent = server default).
  agentic_mesh_protocol.pagination.v1.PaginationRequest pagination = 5;
}

// ListRecordsResponse returns a page of records.
message ListRecordsResponse {
  // results holds one StorageResult per listed record.
  repeated StorageResult results = 1;
  // bulk summarizes the listing and its pagination.
  agentic_mesh_protocol.pagination.v1.BulkResponse bulk = 2 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ DeleteCollection ════════════════════════════════════ //

// DeleteCollectionRequest deletes every record of a collection.
message DeleteCollectionRequest {
  // context is the kind of context the collection is scoped to.
  StorageContext context = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // collection is the name of the group of records to delete.
  string collection = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];
}

// DeleteCollectionResponse reports how many records were deleted.
message DeleteCollectionResponse {
  // bulk summarizes the deletion (total_processed = deleted records).
  agentic_mesh_protocol.pagination.v1.BulkResponse bulk = 1 [(buf.validate.field).required = true];
}
