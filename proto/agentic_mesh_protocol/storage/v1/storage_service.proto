syntax = "proto3";

package agentic_mesh_protocol.storage.v1;

import "agentic_mesh_protocol/storage/v1/storage_dto.proto";

// StorageService stores context-scoped JSON records grouped in collections.
service StorageService {
  // CreateRecord stores a new record.
  rpc CreateRecord(CreateRecordRequest) returns (CreateRecordResponse);
  // GetRecord retrieves a record.
  rpc GetRecord(GetRecordRequest) returns (GetRecordResponse);
  // UpdateRecord overwrites the data of an existing record.
  rpc UpdateRecord(UpdateRecordRequest) returns (UpdateRecordResponse);
  // DeleteRecord deletes a record.
  rpc DeleteRecord(DeleteRecordRequest) returns (DeleteRecordResponse);
  // ListRecords retrieves a page of the records of a collection, optionally filtered.
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
  // DeleteCollection deletes every record of a collection.
  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse);
}
