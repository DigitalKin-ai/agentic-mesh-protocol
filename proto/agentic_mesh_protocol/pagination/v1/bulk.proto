syntax = "proto3";

package agentic_mesh_protocol.pagination.v1;

import "agentic_mesh_protocol/pagination/v1/pagination.proto";
import "buf/validate/validate.proto";

// BulkResponse represents the response for a bulk operation on multiple items.
message BulkResponse {
  // total is the total number of items processed in the bulk operation.
  int32 total_process = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 0
  ];

  // total_failed is the total number of items that failed in the bulk operation.
  int32 total_failed = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 0
  ];

  // pagination contains information about the pagination of the results, if applicable.
  optional agentic_mesh_protocol.pagination.v1.PaginationResponse pagination = 3;
}

// OperationError represents an error that occurred while processing an individual item in the bulk operation.
message OperationError {
  // code is a short string representing the type of error that occurred.
  string code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // message is a human-readable description of the error that occurred.
  string message = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}
