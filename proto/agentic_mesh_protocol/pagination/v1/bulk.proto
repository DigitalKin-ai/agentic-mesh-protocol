syntax = "proto3";

package agentic_mesh_protocol.pagination.v1;

import "agentic_mesh_protocol/pagination/v1/pagination.proto";
import "buf/validate/validate.proto";

// BulkResponse summarizes an operation over several items (a listing or a batch write).
message BulkResponse {
  option (buf.validate.message).cel = {
    id: "bulk_response.failed_within_processed"
    message: "total_failed must not exceed total_processed"
    expression: "this.total_failed <= this.total_processed"
  };

  // total_processed is the total number of items processed by the operation.
  int32 total_processed = 1 [(buf.validate.field).int32.gte = 0];

  // total_failed is the number of processed items that ended in an OperationError.
  int32 total_failed = 2 [(buf.validate.field).int32.gte = 0];

  // pagination describes the returned page, set for listing operations only.
  PaginationResponse pagination = 3;
}

// OperationError describes why the processing of an individual item failed.
message OperationError {
  // code is a stable, machine-readable error code (e.g. "NOT_FOUND", "INVALID_ARGUMENT").
  string code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 64
      pattern: "^[A-Z][A-Z0-9_]*$"
    }
  ];

  // message is a human-readable description of the error.
  string message = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 2048
  ];
}
