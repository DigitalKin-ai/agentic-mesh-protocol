syntax = "proto3";

package agentic_mesh_protocol.common.v1;

// Visibility is the read-access scope of a resource (setup, module, record, file).
enum Visibility {
  // VISIBILITY_UNSPECIFIED lets the server apply its default scope (or keep the current one).
  VISIBILITY_UNSPECIFIED = 0;
  // PUBLIC: visible to everyone.
  PUBLIC = 1;
  // PRIVATE: visible only to the owner.
  PRIVATE = 2;
  // INTERNAL: visible within the owner's organization.
  INTERNAL = 3;
}
