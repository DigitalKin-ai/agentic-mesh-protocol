syntax = "proto3";

package agentic_mesh_protocol.filesystem.v1;

import "agentic_mesh_protocol/filesystem/v1/filesystem_dto.proto";

// FilesystemService stores binary files with their metadata, scoped to a context.
service FilesystemService {
  // UploadFiles uploads a batch of files; each file succeeds or fails on its own.
  rpc UploadFiles(UploadFilesRequest) returns (UploadFilesResponse);
  // GetFile retrieves a single file, optionally with its content.
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  // ListFiles retrieves a page of files, optionally filtered and with their content.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // UpdateFile renames a file, replaces its content or updates its metadata.
  rpc UpdateFile(UpdateFileRequest) returns (UpdateFileResponse);
  // DeleteFiles deletes (or marks as deleted) the files matching a filter.
  rpc DeleteFiles(DeleteFilesRequest) returns (DeleteFilesResponse);
}
