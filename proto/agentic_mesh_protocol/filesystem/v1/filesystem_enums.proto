syntax = "proto3";

package agentic_mesh_protocol.filesystem.v1;

// FileType is the classification of a file.
enum FileType {
  // FILE_TYPE_UNSPECIFIED indicates that the file type is not set.
  FILE_TYPE_UNSPECIFIED = 0;
  // DOCUMENT: document files (PDF, DOC, TXT, etc.).
  DOCUMENT = 1;
  // IMAGE: image files (PNG, JPG, GIF, etc.).
  IMAGE = 2;
  // VIDEO: video files (MP4, AVI, MOV, etc.).
  VIDEO = 3;
  // AUDIO: audio files (MP3, WAV, etc.).
  AUDIO = 4;
  // ARCHIVE: archive files (ZIP, TAR, etc.).
  ARCHIVE = 5;
  // CODE: source code files.
  CODE = 6;
  // OTHER: any other file type.
  OTHER = 7;
}

// FileStatus is the lifecycle status of a file.
enum FileStatus {
  // FILE_STATUS_UNSPECIFIED indicates that the file status is not set.
  FILE_STATUS_UNSPECIFIED = 0;
  // UPLOADING: the file is being uploaded.
  UPLOADING = 1;
  // ACTIVE: the file is available for use.
  ACTIVE = 2;
  // PROCESSING: the file is being processed.
  PROCESSING = 3;
  // ARCHIVED: the file has been archived.
  ARCHIVED = 4;
  // DELETED: the file is marked for deletion.
  DELETED = 5;
}

// FileContext is the kind of context a file is scoped to. The matching identifier
// is resolved server-side from the task metadata, never sent by the caller.
enum FileContext {
  // FILE_CONTEXT_UNSPECIFIED: the file is attached to no mission nor setup.
  FILE_CONTEXT_UNSPECIFIED = 0;
  // MISSIONS: the file belongs to the mission of the task.
  MISSIONS = 1;
  // SETUPS: the file belongs to the setup of the task.
  SETUPS = 2;
  // USERS: the file belongs to the user of the task.
  USERS = 3;
  // ORGANIZATIONS: the file belongs to the organization of the task.
  ORGANIZATIONS = 4;
}
