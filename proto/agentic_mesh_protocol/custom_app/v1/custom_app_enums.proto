syntax = "proto3";

package agentic_mesh_protocol.custom_app.v1;

// CustomAppRight is the right a caller holds on a custom app. Each right includes the ones before it.
enum CustomAppRight {
  // CUSTOM_APP_RIGHT_UNSPECIFIED indicates that the right is not set.
  CUSTOM_APP_RIGHT_UNSPECIFIED = 0;
  // READ: open the app, read its structure and its records.
  READ = 1;
  // DATA_WRITE: READ, plus create, update and delete the records of the app.
  DATA_WRITE = 2;
  // FULL_EDIT: DATA_WRITE, plus edit the information, the draft structure and build new versions.
  FULL_EDIT = 3;
}

// CustomAppOwnerKind is the kind of owner of a custom app.
enum CustomAppOwnerKind {
  // CUSTOM_APP_OWNER_KIND_UNSPECIFIED indicates that the owner kind is not set.
  CUSTOM_APP_OWNER_KIND_UNSPECIFIED = 0;
  // USER: the app belongs to a user (owner_id is a "users:" id).
  USER = 1;
  // ORGANIZATION: the app belongs to an organization (owner_id is an "organizations:" id).
  ORGANIZATION = 2;
}

// CustomAppFieldType is the type of a field of a custom app table.
enum CustomAppFieldType {
  // CUSTOM_APP_FIELD_TYPE_UNSPECIFIED indicates that the field type is not set.
  CUSTOM_APP_FIELD_TYPE_UNSPECIFIED = 0;
  // STRING: a single line of text.
  STRING = 1;
  // TEXT: a multi-line text.
  TEXT = 2;
  // NUMBER: a number.
  NUMBER = 3;
  // BOOLEAN: true or false.
  BOOLEAN = 4;
  // DATE: a calendar date.
  DATE = 5;
  // COLOR: a color.
  COLOR = 6;
  // URL: a web address.
  URL = 7;
  // SELECT: one value among the options of the field.
  SELECT = 8;
}

// CustomAppScaffoldKind is the kind of standard screen the server generates from a table.
enum CustomAppScaffoldKind {
  // CUSTOM_APP_SCAFFOLD_KIND_UNSPECIFIED indicates that the scaffold kind is not set.
  CUSTOM_APP_SCAFFOLD_KIND_UNSPECIFIED = 0;
  // LIST: a screen listing the records of the table.
  LIST = 1;
  // FORM: a screen creating or editing a record of the table.
  FORM = 2;
  // DETAIL: a screen showing a single record of the table.
  DETAIL = 3;
}
