// ════════════════════════════════════ ScaffoldCustomAppFile ════════════════════════════════════ //

// ScaffoldCustomAppFileRequest writes a standard TSX screen generated server-side from the schema of a
// table, without the model (FULL_EDIT). The file then belongs to the app like any other.
message ScaffoldCustomAppFileRequest {
  // custom_app_id is the unique identifier of the app.
  string custom_app_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "custom_apps:"
      min_len: 13
      max_len: 256
    }
  ];

  // table is the name of the table of the draft the screen is generated from.
  string table = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 40
      pattern: "^[a-z][a-z0-9_]{0,39}$"
    }
  ];

  // kind is the kind of screen to generate.
  CustomAppScaffoldKind kind = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // path is the path of the file to write (absent = a server default derived from the table and the kind).
  optional string path = 4 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^src/[a-zA-Z0-9_\\-/]+\\.(tsx|ts|css)$"
  }];

  // expected_draft_revision makes the write fail unless the draft is at this revision (absent = no check).
  optional int32 expected_draft_revision = 5 [(buf.validate.field).int32.gte = 0];
}

// ScaffoldCustomAppFileResponse returns the app, the path written and the new draft revision.
message ScaffoldCustomAppFileResponse {
  // result holds the CustomApp, or an OperationError.
  CustomAppResult result = 1 [(buf.validate.field).required = true];

  // path is the path of the file written (absent on error).
  optional string path = 2 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^src/[a-zA-Z0-9_\\-/]+\\.(tsx|ts|css)$"
  }];

  // draft_revision is the revision of the draft after the operation (0 on error).
  int32 draft_revision = 3 [(buf.validate.field).int32.gte = 0];
}

// ════════════════════════════════════ BuildCustomApp ════════════════════════════════════ //

// BuildCustomAppRequest builds a new version of a custom app from its draft and publishes it at once (FULL_EDIT).
message BuildCustomAppRequest {
  // custom_app_id is the unique identifier of the app.
  string custom_app_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "custom_apps:"
      min_len: 13
      max_len: 256
    }
  ];
}

// BuildCustomAppResponse returns the built version, or the problems found in the draft.
message BuildCustomAppResponse {
  // result holds the CustomAppVersion, the CustomAppBuildErrors, or an OperationError.
  CustomAppBuildResult result = 1 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ ListCustomAppRecords ════════════════════════════════════ //

// ListCustomAppRecordsRequest lists the records of a table of a custom app (READ).
message ListCustomAppRecordsRequest {
  // custom_app_id is the unique identifier of the app.
  string custom_app_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "custom_apps:"
      min_len: 13
      max_len: 256
    }
  ];

  // table is the name of the table.
  string table = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 40
      pattern: "^[a-z][a-z0-9_]{0,39}$"
    }
  ];

  // filter keeps the records whose fields equal the given values, keyed by field name (absent = no filter).
  google.protobuf.Struct filter = 3;

  // pagination selects the page to return (absent = server default); pagination.order accepts
  // "created_at", "updated_at" and the field names of the table.
  agentic_mesh_protocol.pagination.v1.PaginationRequest pagination = 4;
}

// ListCustomAppRecordsResponse returns a page of records.
message ListCustomAppRecordsResponse {
  // results holds one CustomAppRecordResult per listed record.
  repeated CustomAppRecordResult results = 1;
  // bulk summarizes the listing and its pagination.
  agentic_mesh_protocol.pagination.v1.BulkResponse bulk = 2 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ UpsertCustomAppRecords ════════════════════════════════════ //

// UpsertCustomAppRecordsRequest creates and updates records of a table of a custom app (DATA_WRITE).
message UpsertCustomAppRecordsRequest {
  option (buf.validate.message).cel = {
    id: "upsert_custom_app_records_request.unique_ids"
    message: "a record cannot be updated twice in the same batch"
    expression: "this.records.filter(r, r.id != '').map(r, r.id).unique()"
  };

  // custom_app_id is the unique identifier of the app.
  string custom_app_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "custom_apps:"
      min_len: 13
      max_len: 256
    }
  ];

  // table is the name of the table.
  string table = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 40
      pattern: "^[a-z][a-z0-9_]{0,39}$"
    }
  ];

  // records are the records to write: a record without id is created, a record with an id is updated.
  repeated CustomAppRecordData records = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

// UpsertCustomAppRecordsResponse reports the outcome of every written record.
message UpsertCustomAppRecordsResponse {
  // results holds one CustomAppRecordResult per written record, in the request order.
  repeated CustomAppRecordResult results = 1 [(buf.validate.field).repeated.max_items = 100];
  // bulk summarizes the batch write.
  agentic_mesh_protocol.pagination.v1.BulkResponse bulk = 2 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ DeleteCustomAppRecords ════════════════════════════════════ //

// DeleteCustomAppRecordsRequest deletes records of a table of a custom app (DATA_WRITE).
message DeleteCustomAppRecordsRequest {
  // custom_app_id is the unique identifier of the app.
  string custom_app_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "custom_apps:"
      min_len: 13
      max_len: 256
    }
  ];

  // table is the name of the table.
  string table = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 40
      pattern: "^[a-z][a-z0-9_]{0,39}$"
    }
  ];

  // ids are the identifiers of the records to delete.
  repeated string ids = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
}

// DeleteCustomAppRecordsResponse reports the outcome of every deleted record.
message DeleteCustomAppRecordsResponse {
  // results holds one CustomAppRecordResult per deleted record, in the request order.
  repeated CustomAppRecordResult results = 1 [(buf.validate.field).repeated.max_items = 100];
  // bulk summarizes the batch deletion.
  agentic_mesh_protocol.pagination.v1.BulkResponse bulk = 2 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ GetCustomAppRuntime ════════════════════════════════════ //

// GetCustomAppRuntimeRequest describes the runtime the apps are built against, from its manifest.
// Open to every member of the organization of the task: no app is needed.
message GetCustomAppRuntimeRequest {
  // runtime_version is the version to describe (absent = the current version).
  optional string runtime_version = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];

  // topic asks for the detail of one topic, with examples, e.g. "data", "forms", "charts" or "theme"
  // (absent = the overview: rules, imports, theme variables, fonts and topics).
  optional string topic = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z][a-z0-9_]*$"
  }];
}

// GetCustomAppRuntimeResponse returns the runtime description.
message GetCustomAppRuntimeResponse {
  // result holds the CustomAppRuntime, or an OperationError.
  CustomAppRuntimeResult result = 1 [(buf.validate.field).required = true];
}
