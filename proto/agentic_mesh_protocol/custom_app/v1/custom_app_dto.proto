      pattern: "^[a-z][a-z0-9_]{0,39}$"
    }
  ];

  // expected_draft_revision makes the write fail unless the draft is at this revision (absent = no check).
  optional int32 expected_draft_revision = 3 [(buf.validate.field).int32.gte = 0];
}

// RemoveCustomAppTableResponse returns the app and the new draft revision.
message RemoveCustomAppTableResponse {
