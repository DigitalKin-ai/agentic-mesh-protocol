syntax = "proto3";

package agentic_mesh_protocol.gateway.v1;

import "agentic_mesh_protocol/gateway/v1/gateway_dto.proto";
import "agentic_mesh_protocol/gateway/v1/gateway_messages.proto";

// GatewayService is the external surface for the consumers of a producer module:
//
//   1. AssociateTask — mint and register a sub-task under a running parent.
//   2. StartStream   — kick off a task; returns an ACK immediately.
//   3. Stream        — BiDi: read the output, send upstream input.
//   4. SendSignal    — out-of-band control (cancel a task, invalidate a cache).
service GatewayService {
  // AssociateTask generates and registers a sub-task linked to a running parent task
  // (and its mission) before it is started. The returned task_id is then passed to StartStream.
  rpc AssociateTask(AssociateTaskRequest) returns (AssociateTaskResponse);

  // StartStream registers a task and dispatches its producer; the output flows over Stream.
  rpc StartStream(StartStreamRequest) returns (StartStreamResponse);

  // Stream is the BiDi channel between a client and the Gateway:
  //   1. The Gateway seeds StreamResponse{module_start_info} at seq 1 (from StartStream).
  //   2. The client sends StreamRequest{task_id, from_seq, data=<query>}; the query is
  //      delivered to the SDK module as its first input.
  //   3. The Gateway yields one StreamResponse{seq, data} per output of the module.
  //   4. The client may send more StreamRequest{data} frames as upstream input.
  //   5. The Gateway emits stream.end and closes the stream cleanly.
  // Errors travel in-band as stream.error sentinels in StreamResponse.data.root.protocol,
  // never as a gRPC status on Stream.
  rpc Stream(stream StreamRequest) returns (stream StreamResponse);

  // SendSignal publishes an out-of-band control signal.
  rpc SendSignal(SendSignalRequest) returns (SendSignalResponse);
}
