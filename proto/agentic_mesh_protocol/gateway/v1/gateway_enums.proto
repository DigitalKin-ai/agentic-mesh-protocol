syntax = "proto3";

package agentic_mesh_protocol.gateway.v1;

// CacheScope is the server-wide cache an InvalidateSignal wipes.
enum CacheScope {
  // CACHE_SCOPE_UNSPECIFIED indicates that the scope is not set.
  CACHE_SCOPE_UNSPECIFIED = 0;
  // ALL wipes every cache (all the scopes below).
  ALL = 1;
  // CHANNELS clears the gRPC channel pool, stubs, circuit breakers and bulkheads.
  CHANNELS = 2;
  // MODELS clears the Pydantic model class cache (schema filtering).
  MODELS = 3;
  // SETUP clears the setup JSON cache fetched from the services provider.
  SETUP = 4;
  // TOOLS clears the resolved tool definitions cache.
  TOOLS = 5;
  // SHARED clears the shared module state (LLM clients, toolkits, user profile, etc.).
  SHARED = 6;
}
