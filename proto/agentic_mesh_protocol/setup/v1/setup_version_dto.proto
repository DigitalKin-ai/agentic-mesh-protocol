syntax = "proto3";

package agentic_mesh_protocol.setup.v1;

import "agentic_mesh_protocol/pagination/v1/bulk.proto";
import "agentic_mesh_protocol/pagination/v1/pagination.proto";
import "agentic_mesh_protocol/setup/v1/setup_messages.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// ════════════════════════════════════ CreateSetupVersion ════════════════════════════════════ //

// CreateSetupVersionRequest cuts a new version of a setup.
message CreateSetupVersionRequest {
  // setup_id is the unique identifier of the parent setup.
  string setup_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "setups:"
      min_len: 8
      max_len: 256
    }
  ];

  // version is the label of the new version (e.g., "v2", "1.1.0").
  string version = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
    }
  ];

  // revision holds the configuration of the new version.
  SetupRevision revision = 3 [(buf.validate.field).required = true];

  // set_as_current makes the new version the current one.
  bool set_as_current = 4;
}

// CreateSetupVersionResponse returns the created version.
message CreateSetupVersionResponse {
  // result holds the created SetupVersion, or an OperationError.
  SetupResult result = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "create_setup_version_response.outcome"
      message: "result must hold a SetupVersion or an OperationError"
      expression: "has(this.version) || has(this.error)"
    }
  ];
}

// ════════════════════════════════════ GetSetupVersion ════════════════════════════════════ //

// GetSetupVersionRequest retrieves a setup version by its identifier.
message GetSetupVersionRequest {
  // setup_version_id is the unique identifier of the setup version.
  string setup_version_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "setup_versions:"
      min_len: 16
      max_len: 256
    }
  ];
}

// GetSetupVersionResponse returns the requested version.
message GetSetupVersionResponse {
  // result holds the SetupVersion, or an OperationError.
  SetupResult result = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "get_setup_version_response.outcome"
      message: "result must hold a SetupVersion or an OperationError"
      expression: "has(this.version) || has(this.error)"
    }
  ];
}

// ════════════════════════════════════ ListSetupVersions ════════════════════════════════════ //

// ListSetupVersionsRequest lists the versions of a setup, most recent first.
message ListSetupVersionsRequest {
  // setup_id is the unique identifier of the parent setup.
  string setup_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "setups:"
      min_len: 8
      max_len: 256
    }
  ];

  // version restricts the listing to the versions carrying this label (absent = no filter).
  optional string version = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];

  // pagination selects the page to return (absent = server default).
  agentic_mesh_protocol.pagination.v1.PaginationRequest pagination = 3;
}

// ListSetupVersionsResponse returns a page of setup versions.
message ListSetupVersionsResponse {
  // results holds one SetupResult per listed version.
  repeated SetupResult results = 1 [(buf.validate.field).repeated.items.cel = {
    id: "list_setup_versions_response.outcome"
    message: "every result must hold a SetupVersion or an OperationError"
    expression: "has(this.version) || has(this.error)"
  }];
  // bulk summarizes the listing and its pagination.
  agentic_mesh_protocol.pagination.v1.BulkResponse bulk = 2 [(buf.validate.field).required = true];
  // current_setup_version_id is the identifier of the active version (absent = none).
  optional string current_setup_version_id = 3 [(buf.validate.field).string = {
    prefix: "setup_versions:"
    min_len: 16
    max_len: 256
  }];
}

// ════════════════════════════════════ UpdateSetupVersion ════════════════════════════════════ //

// UpdateSetupVersionRequest edits a setup version in place; every absent field is left unchanged.
message UpdateSetupVersionRequest {
  option (buf.validate.message).cel = {
    id: "update_setup_version_request.not_empty"
    message: "at least one of version, content, documentation or structure must be set"
    expression: "has(this.version) || has(this.content) || has(this.documentation) || has(this.structure)"
  };

  // setup_version_id is the unique identifier of the setup version.
  string setup_version_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "setup_versions:"
      min_len: 16
      max_len: 256
    }
  ];

  // version is the new label of the version.
  optional string version = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];

  // content is the new configuration of the version.
  google.protobuf.Struct content = 3;

  // documentation is the new technical description (empty string = clear it).
  optional string documentation = 4 [(buf.validate.field).string.max_len = 300];

  // structure is the new key path description map of the content.
  google.protobuf.Struct structure = 5;
}

// UpdateSetupVersionResponse returns the updated version.
message UpdateSetupVersionResponse {
  // result holds the updated SetupVersion, or an OperationError.
  SetupResult result = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "update_setup_version_response.outcome"
      message: "result must hold a SetupVersion or an OperationError"
      expression: "has(this.version) || has(this.error)"
    }
  ];
}

// ════════════════════════════════════ SetCurrentSetupVersion ════════════════════════════════════ //

// SetCurrentSetupVersionRequest activates an existing version of a setup.
message SetCurrentSetupVersionRequest {
  // setup_id is the unique identifier of the setup.
  string setup_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "setups:"
      min_len: 8
      max_len: 256
    }
  ];

  // setup_version_id is the unique identifier of the version to activate.
  string setup_version_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "setup_versions:"
      min_len: 16
      max_len: 256
    }
  ];
}

// SetCurrentSetupVersionResponse returns the setup with its newly activated version.
message SetCurrentSetupVersionResponse {
  // result holds the updated Setup, or an OperationError.
  SetupResult result = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "set_current_setup_version_response.outcome"
      message: "result must hold a Setup or an OperationError"
      expression: "has(this.setup) || has(this.error)"
    }
  ];
}

// ════════════════════════════════════ DeleteSetupVersion ════════════════════════════════════ //

// DeleteSetupVersionRequest deletes a setup version.
message DeleteSetupVersionRequest {
  // setup_version_id is the unique identifier of the setup version.
  string setup_version_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "setup_versions:"
      min_len: 16
      max_len: 256
    }
  ];
}

// DeleteSetupVersionResponse returns the deleted version.
message DeleteSetupVersionResponse {
  // result holds the deleted SetupVersion, or an OperationError.
  SetupResult result = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "delete_setup_version_response.outcome"
      message: "result must hold a SetupVersion or an OperationError"
      expression: "has(this.version) || has(this.error)"
    }
  ];
}
