syntax = "proto3";

package agentic_mesh_protocol.setup.v1;

import "agentic_mesh_protocol/pagination/v1/bulk.proto";
import "agentic_mesh_protocol/pagination/v1/pagination.proto";
import "agentic_mesh_protocol/setup/v1/setup_enums.proto";
import "agentic_mesh_protocol/setup/v1/setup_messages.proto";
import "buf/validate/validate.proto";

// ════════════════════════════════════ CreateSetup ════════════════════════════════════ //

// Request and Response messages for creating a new Setup.
message CreateSetupRequest {
  // organization_id is the unique identifier of the organization.
  string organization_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // owner_id is the owner ID of the setup.
  string owner_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "owner_id_prefix"
      expression: "this.startsWith('users:')"
      message: "owner_id must start with 'users:'"
    },
    (buf.validate.field).cel = {
      id: "owner_id_length"
      expression: "this.size() >= 7"
      message: "owner_id must be at least 1 characters long"
    }
  ];

  // module_id is the module identifier associated with the setup.
  string module_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "module_id_prefix"
      expression: "this.startsWith('modules:')"
      message: "module_id must start with 'modules:'"
    },
    (buf.validate.field).cel = {
      id: "module_id_length"
      expression: "this.size() >= 9"
      message: "module_id must be at least 1 characters long"
    }
  ];

  // name is the name of the setup.
  string name = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // status is the status of the setup.
  SetupStatus status = 5 [(buf.validate.field).required = true];

  // current_setup_version is the active setup version.
  optional SetupVersion current_setup_version = 6 [(buf.validate.field).required = true];
}

// Response message for CreateSetup operation.
message CreateSetupResponse {
  // Result of the operation. Expected oneof type: Setup or OperationError.
  SetupResult result = 1 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ GetSetup ════════════════════════════════════ //

// Request message for retrieving a Setup by its ID.
message GetSetupRequest {
  // setup_id is the unique identifier of the setup.
  string setup_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "setup_id_prefix"
      expression: "this.startsWith('setups:')"
      message: "setup_id must start with 'setups:'"
    },
    (buf.validate.field).cel = {
      id: "setup_id_length"
      expression: "this.size() >= 8"
      message: "setup_id must be at least 1 characters long"
    }
  ];

  // version is the unique identifier of the active setup version.
  optional string version = 2 [
    (buf.validate.field).required = false,
    (buf.validate.field).string.min_len = 1
  ];
}

// Response message for GetSetup operation.
message GetSetupResponse {
  // Result of the operation. Expected oneof type: Setup or OperationError.
  SetupResult result = 1 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ UpdateSetup ════════════════════════════════════ //

// Request and Response messages for updating an existing Setup.
message UpdateSetupRequest {
  // setup_id is the unique identifier of the setup.
  string setup_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "setup_id_prefix"
      expression: "this.startsWith('setups:')"
      message: "setup_id must start with 'setups:'"
    },
    (buf.validate.field).cel = {
      id: "setup_id_length"
      expression: "this.size() >= 8"
      message: "setup_id must be at least 1 characters long"
    }
  ];

  // owner_id is the owner ID of the setup.
  string owner_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "owner_id_prefix"
      expression: "this.startsWith('users:')"
      message: "owner_id must start with 'users:'"
    },
    (buf.validate.field).cel = {
      id: "owner_id_length"
      expression: "this.size() >= 7"
      message: "owner_id must be at least 1 characters long"
    }
  ];

  // name is the name of the setup.
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // status is the status of the setup.
  SetupStatus status = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // current_setup_version is the active setup version.
  SetupVersion current_setup_version = 5 [(buf.validate.field).required = true];
}

// Response message for UpdateSetup operation.
message UpdateSetupResponse {
  // Result of the operation. Expected oneof type: Setup or OperationError.
  SetupResult result = 1 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ DeleteSetup ════════════════════════════════════ //

// Request and Response messages for deleting a Setup.
message DeleteSetupRequest {
  // setup_id is the unique identifier of the setup.
  string setup_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "setup_id_prefix"
      expression: "this.startsWith('setups:')"
      message: "setup_id must start with 'setups:'"
    },
    (buf.validate.field).cel = {
      id: "setup_id_length"
      expression: "this.size() >= 8"
      message: "setup_id must be at least 1 characters long"
    }
  ];
}

// Response message for DeleteSetup operation.
message DeleteSetupResponse {
  // Result of the operation. Expected oneof type: Setup or OperationError.
  SetupResult result = 1 [(buf.validate.field).required = true];
}

// ════════════════════════════════════ ListSetups ════════════════════════════════════ //

// Request and Response messages for listing Setups with filtering and pagination.
message ListSetupsRequest {
  // organization_id filters by organization ID.
  optional string organization_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "organization_id_prefix"
      expression: "this.startsWith('organizations:')"
      message: "organization_id must start with 'organizations:'"
    },
    (buf.validate.field).cel = {
      id: "organization_id_length"
      expression: "this.size() >= 15"
      message: "organization_id must be at least 1 characters long"
    }
  ];

  // owner_id filters by owner ID.
  optional string owner_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "owner_id_prefix"
      expression: "this.startsWith('users:')"
      message: "owner_id must start with 'users:'"
    },
    (buf.validate.field).cel = {
      id: "owner_id_length"
      expression: "this.size() >= 7"
      message: "owner_id must be at least 1 characters long"
    }
  ];

  // pagination contains pagination settings.
  agentic_mesh_protocol.pagination.v1.PaginationRequest pagination = 3 [(buf.validate.field).required = true];
}

// Response message for ListSetups operation.
message ListSetupsResponse {
  // Result of the operation. Expected oneof type: Setup or OperationError.
  repeated SetupResult result = 1 [(buf.validate.field).required = true];
  // bulk contains information about the bulk operation, if applicable.
  agentic_mesh_protocol.pagination.v1.BulkResponse bulk = 2 [(buf.validate.field).required = true];
}
