syntax = "proto3";

package agentic_mesh_protocol.setup.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// SetupStatus
// Represents the status of a setup.
//
// Fields:
// - DRAFT: Setup is a draft
// - VALIDATING: Setup is being validated
// - READY: Setup is ready
// - PAUSED: Setup is paused
// - FAILED: Setup failed
// - ARCHIVED: Setup has been archived
// - NEEDS_CONFIGURATION: Setup needs configuration
// - CONFIGURATION_FAILED: Setup configuration failed
// - CONFIGURATION_SUCCEEDED: Setup configuration succeeded
enum SetupStatus {
  // DRAFT: Setup is a draft
  DRAFT = 0;
  // VALIDATING: Setup is being validated
  VALIDATING = 1;
  // READY: Setup is ready
  READY = 2;
  // PAUSED: Setup is paused
  PAUSED = 4;
  // FAILED: Setup failed
  FAILED = 5;
  // ARCHIVED: Setup has been archived
  ARCHIVED = 6;
  // NEEDS_CONFIGURATION: Setup needs configuration
  NEEDS_CONFIGURATION = 7;
  // CONFIGURATION_FAILED: Setup configuration failed
  CONFIGURATION_FAILED = 8;
  // CONFIGURATION_SUCCEEDED: Setup configuration succeeded
  CONFIGURATION_SUCCEEDED = 9;
}

// Visibility
// Represents the visibility scope of a setup.
//
// Fields:
// - VISIBILITY_UNSPECIFIED: Visibility not specified
// - VISIBILITY_PUBLIC: Visible to everyone
// - VISIBILITY_PRIVATE: Visible only to the owner
// - VISIBILITY_INTERNAL: Visible within the organisation
enum Visibility {
  // VISIBILITY_UNSPECIFIED: Visibility not specified
  VISIBILITY_UNSPECIFIED = 0;
  // VISIBILITY_PUBLIC: Visible to everyone
  VISIBILITY_PUBLIC = 1;
  // VISIBILITY_PRIVATE: Visible only to the owner
  VISIBILITY_PRIVATE = 2;
  // VISIBILITY_INTERNAL: Visible within the organisation
  VISIBILITY_INTERNAL = 3;
}

// SetupVersion
// Represents a version of a setup's configuration.
//
// Fields:
// - id: The unique identifier of the setup version.
// - setup_id: The unique identifier of the parent setup.
// - name: The identifier of the parent setup.
// - version: A label for the version (e.g., "v1", "v2").
// - content: Key-value pairs containing configuration content.
// - creation_date: setup version creation date
message SetupVersion {
  // id: The unique identifier of the setup version.
  string id = 1 [(buf.validate.field).required = true];
  // setup_id: The unique identifier of the parent setup.
  string setup_id = 2 [(buf.validate.field).required = true];
  // version: The label for this version.
  string version = 3 [(buf.validate.field).required = true];
  // content: Key-value pairs for configuration content.
  google.protobuf.Struct content = 4 [(buf.validate.field).required = true];
  // creation_date: setup version creation date
  google.protobuf.Timestamp creation_date = 5;
}

// Setup
// Represents a configuration associated with a mission.
//
// Fields:
// - id: unique id used in database
// - name: The name of the setup.
// - organisation_id: The unique identifier of the organisation.
// - owner_id: The owner_id of the setup.
// - module_id: The module identifier associated with the setup.
// - current_setup_version: The identifier of the active setup version.
message Setup {
  // id: The unique identifier of the setup.
  string id = 1 [(buf.validate.field).required = true];
  // name: The name of the setup.
  string name = 2 [(buf.validate.field).required = true];
  // organisation_id: The unique identifier of the organisation.
  string organisation_id = 3 [(buf.validate.field).required = true];
  // owner_id: The owner_id of the setup.
  string owner_id = 4 [(buf.validate.field).required = true];
  // module_id: The module identifier associated with the setup.
  string module_id = 5 [(buf.validate.field).required = true];
  // current_setup_version: The unique identifier of the active setup version.
  optional SetupVersion current_setup_version = 6;
  // status: The status of the setup.
  SetupStatus status = 7 [(buf.validate.field).required = true];
  // visibility: The visibility scope of the setup.
  Visibility visibility = 8 [(buf.validate.field).required = true];
}

// GetSetupRequest
// This request is used to retrieve a setup by its unique identifier.
//
// Fields:
// - setup_id: The unique identifier of the setup.
// - version: (Optional) The unique identifier of the active setup version.
message GetSetupRequest {
  // setup_id: The unique identifier of the setup.
  string setup_id = 1 [(buf.validate.field).required = true];
  // version: The unique identifier of the active setup version.
  optional string version = 2;
  // structure_key: Specific key query from setup version.
  string structure_key = 3;
}

// GetSetupResponse
// Returns the setup corresponding to the requested identifier.
//
// Fields:
// - setup: The retrieved setup entity.
// - setup_version: The retrieved setup_version if exists.
message GetSetupResponse {
  // setup: The retrieved setup entity.
  Setup setup = 1;
  // setup_version: The retrieved setup_version if exists.
  SetupVersion setup_version = 2;
}

// CreateSetupRequest
// This request is used to create a new setup. The owner and organisation are
// resolved from the request context, and the identifier is generated server-side.
//
// Fields:
// - name: The name of the setup.
// - content: The configuration content of the initial setup version.
message CreateSetupRequest {
  // name: The name of the setup.
  string name = 1 [(buf.validate.field).required = true];
  // content: Key-value pairs for the initial configuration content.
  google.protobuf.Struct content = 2 [(buf.validate.field).required = true];
  // documentation: Technical descritpion of module
  string documentation = 3 [(buf.validate.field).required = true];
  // structure: Arborescence of the data files for services
  google.protobuf.Struct structure = 4 [(buf.validate.field).required = true];
}

// CreateSetupResponse
// Returns the newly created setup.
//
// Fields:
// - success: Whether the operation succeeded.
// - setup: The newly created setup entity.
// - setup_version: The newly created setup version.
message CreateSetupResponse {
  // success: Whether the operation succeeded.
  bool success = 1;
  // setup: The newly created setup entity.
  Setup setup = 2;
  // setup_version: The newly created setup version.
  SetupVersion setup_version = 3;
  // structure: Arborescence of the data files for services
  google.protobuf.Struct structure = 4;
}

// UpdateSetupRequest
// This request is used to update an existing setup.
//
// Fields:
// - setup_id: The unique identifier of the setup to update.
// - name: The new name of the setup.
// - content: The new configuration content.
// - set_as_current: Whether the new version becomes the current one.
message UpdateSetupRequest {
  // setup_id: The unique identifier of the setup.
  string setup_id = 1 [(buf.validate.field).required = true];
  // name: The name of the setup.
  string name = 2 [(buf.validate.field).required = true];
  // content: Key-value pairs for configuration content.
  google.protobuf.Struct content = 3 [(buf.validate.field).required = true];
  // set_as_current: Whether the new version becomes the current one.
  bool set_as_current = 4;
  // documentation: Technical descritpion of module
  string documentation = 5 [(buf.validate.field).required = true];
  // structure: Arborescence of the data files for services
  google.protobuf.Struct structure = 6 [(buf.validate.field).required = true];
}

// UpdateSetupResponse
// Returns the updated setup.
//
// Fields:
// - success: Whether the operation succeeded.
// - setup: The updated setup entity.
// - setup_version: The updated setup version.
message UpdateSetupResponse {
  // success: Whether the operation succeeded.
  bool success = 1;
  // setup: The updated setup entity.
  Setup setup = 2;
  // setup_version: The updated setup version.
  SetupVersion setup_version = 3;
  // structure: Arborescence of the data files for services
  google.protobuf.Struct structure = 4 [(buf.validate.field).required = true];
}

// DeleteSetupRequest
// This request is used to delete a setup by its unique identifier.
//
// Fields:
// - setup_id: The unique identifier of the setup to delete.
message DeleteSetupRequest {
  // setup_id: The unique identifier of the setup.
  string setup_id = 1 [(buf.validate.field).required = true];
}

// DeleteSetupResponse
// Indicates whether the setup has been successfully deleted.
//
// Fields:
// - success: Whether the operation succeeded.
message DeleteSetupResponse {
  // success: Whether the operation succeeded.
  bool success = 1;
}

// ChangeVisibilityRequest
// This request is used to change the visibility scope of an existing setup.
//
// Fields:
// - setup_id: The unique identifier of the setup.
// - visibility: The new visibility scope for the setup.
message ChangeVisibilityRequest {
  // setup_id: The unique identifier of the setup.
  string setup_id = 1 [(buf.validate.field).required = true];
  // visibility: The new visibility scope for the setup.
  Visibility visibility = 2 [(buf.validate.field).required = true];
}

// ChangeVisibilityResponse
// Returns the setup with its updated visibility.
//
// Fields:
// - success: Whether the operation succeeded.
// - setup: The updated setup entity.
// - setup_version: The current setup version.
message ChangeVisibilityResponse {
  // success: Whether the operation succeeded.
  bool success = 1;
  // setup: The updated setup entity.
  Setup setup = 2;
  // setup_version: The current setup version.
  SetupVersion setup_version = 3;
}

// ListSetupVersionsRequest
// This request is used to list the versions of a setup, most recent first.
//
// Fields:
// - setup_id: The unique identifier of the setup whose versions are listed.
// - limit: The maximum number of setup versions to return.
// - offset: The number of setup versions to skip for pagination.
message ListSetupVersionsRequest {
  // setup_id: The unique identifier of the setup.
  string setup_id = 1 [(buf.validate.field).required = true];
  // limit: The maximum number of setup versions to return.
  int32 limit = 2 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 1000
  ];
  // offset: The number of setup versions to skip for pagination.
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

// ListSetupVersionsResponse
// Returns the versions of a setup, ordered by creation date descending.
//
// Fields:
// - setup_versions: The setup versions matching the request.
// - total_count: The total number of setup versions for this setup.
// - current_setup_version_id: The identifier of the currently active version.
message ListSetupVersionsResponse {
  // setup_versions: The setup versions matching the request.
  repeated SetupVersion setup_versions = 1;
  // total_count: The total number of setup versions for this setup.
  int32 total_count = 2 [(buf.validate.field).int32.gte = 0];
  // current_setup_version_id: The identifier of the currently active version, empty if none.
  string current_setup_version_id = 3;
}

// SetCurrentSetupVersionRequest
// This request is used to activate an existing version of a setup, making it
// the current one.
//
// Fields:
// - setup_id: The unique identifier of the setup.
// - setup_version_id: The unique identifier of the setup version to activate.
message SetCurrentSetupVersionRequest {
  // setup_id: The unique identifier of the setup.
  string setup_id = 1 [(buf.validate.field).required = true];
  // setup_version_id: The unique identifier of the setup version to activate.
  string setup_version_id = 2 [(buf.validate.field).required = true];
}

// SetCurrentSetupVersionResponse
// Returns the setup with its newly activated version.
//
// Fields:
// - success: Whether the operation succeeded.
// - setup: The updated setup entity.
// - setup_version: The newly activated setup version.
message SetCurrentSetupVersionResponse {
  // success: Whether the operation succeeded.
  bool success = 1;
  // setup: The updated setup entity.
  Setup setup = 2;
  // setup_version: The newly activated setup version.
  SetupVersion setup_version = 3;
}
