syntax = "proto3";

package agentic_mesh_protocol.setup.v1;

import "agentic_mesh_protocol/common/v1/common_enums.proto";
import "agentic_mesh_protocol/pagination/v1/bulk.proto";
import "agentic_mesh_protocol/setup/v1/setup_enums.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ═════════════════════════════════════ Objects ════════════════════════════════════ //

// SetupVersion is an immutable revision of a setup's configuration.
message SetupVersion {
  // id is the unique identifier of the setup version.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "setup_versions:"
      min_len: 16
      max_len: 256
    }
  ];

  // setup_id is the unique identifier of the parent setup.
  string setup_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "setups:"
      min_len: 8
      max_len: 256
    }
  ];

  // version is the label of this version (e.g., "v1", "1.0.0").
  string version = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];

  // documentation is the technical description of the setup, indexed by the registry search.
  string documentation = 4 [(buf.validate.field).string.max_len = 300];

  // content holds the configuration of this version.
  google.protobuf.Struct content = 5 [(buf.validate.field).required = true];

  // structure maps a leaf key path of content to a description of what is there
  // (absent when the version was cut without one).
  google.protobuf.Struct structure = 6;

  // created_at is the creation date of the version.
  google.protobuf.Timestamp created_at = 7;
}

// SetupRevision is what a new setup version is cut from: a configuration and what describes it.
message SetupRevision {
  // content holds the configuration of the version.
  google.protobuf.Struct content = 1 [(buf.validate.field).required = true];

  // structure maps a leaf key path of content to a description of what is there.
  google.protobuf.Struct structure = 2;

  // documentation is the technical description carried by the version, indexed by the registry search.
  string documentation = 3 [(buf.validate.field).string.max_len = 300];
}

// Setup is a configured instance of a module.
message Setup {
  // id is the unique identifier of the setup.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "setups:"
      min_len: 8
      max_len: 256
    }
  ];

  // organization_id is the unique identifier of the owning organization.
  string organization_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "organizations:"
      min_len: 15
      max_len: 256
    }
  ];

  // owner_id is the unique identifier of the owning user.
  string owner_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "users:"
      min_len: 7
      max_len: 256
    }
  ];

  // module_id is the unique identifier of the module backing the setup.
  string module_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      prefix: "modules:"
      min_len: 9
      max_len: 256
    }
  ];

  // name is the human-readable name of the setup.
  string name = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 255
  ];

  // status is the lifecycle status of the setup.
  SetupStatus status = 6 [(buf.validate.field).enum.defined_only = true];

  // visibility is the read-access scope of the setup.
  agentic_mesh_protocol.common.v1.Visibility visibility = 7 [(buf.validate.field).enum.defined_only = true];

  // current_setup_version is the active version (absent when the setup has none yet).
  SetupVersion current_setup_version = 8;
}

// SetupResult is the outcome of an operation on a single setup or setup version.
message SetupResult {
  // identifier is the identifier of the processed item.
  string identifier = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256
  ];

  // outcome holds the processed item, or the error that prevented processing it.
  oneof outcome {
    option (buf.validate.oneof).required = true;
    // setup is the processed setup.
    Setup setup = 2;
    // version is the processed setup version.
    SetupVersion version = 3;
    // error describes why the item could not be processed.
    agentic_mesh_protocol.pagination.v1.OperationError error = 4;
  }
}
