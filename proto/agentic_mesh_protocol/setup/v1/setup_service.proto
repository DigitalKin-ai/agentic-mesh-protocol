syntax = "proto3";

package agentic_mesh_protocol.setup.v1;

import "agentic_mesh_protocol/setup/v1/setup_dto.proto";

// SetupService manages setups: configured instances of a module.
service SetupService {
  // CreateSetup creates a setup and its initial version.
  rpc CreateSetup(CreateSetupRequest) returns (CreateSetupResponse);
  // GetSetup retrieves a setup with its current (or a given) version.
  rpc GetSetup(GetSetupRequest) returns (GetSetupResponse);
  // ListSetups retrieves a page of setups, optionally filtered.
  rpc ListSetups(ListSetupsRequest) returns (ListSetupsResponse);
  // UpdateSetup updates a setup; a new content cuts a new version.
  rpc UpdateSetup(UpdateSetupRequest) returns (UpdateSetupResponse);
  // ChangeVisibility changes the read-access scope of a setup.
  rpc ChangeVisibility(ChangeVisibilityRequest) returns (ChangeVisibilityResponse);
  // DeleteSetup deletes a setup and its versions.
  rpc DeleteSetup(DeleteSetupRequest) returns (DeleteSetupResponse);
  // ChangeOwnership transfers a setup to another user.
  rpc ChangeOwnership(ChangeOwnershipRequest) returns (ChangeOwnershipResponse);
}
