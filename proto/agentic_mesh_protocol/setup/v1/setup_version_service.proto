syntax = "proto3";

package agentic_mesh_protocol.setup.v1;

import "agentic_mesh_protocol/setup/v1/setup_version_dto.proto";

// SetupVersionService manages the versions of a setup.
service SetupVersionService {
  // CreateSetupVersion cuts a new version of a setup.
  rpc CreateSetupVersion(CreateSetupVersionRequest) returns (CreateSetupVersionResponse);
  // GetSetupVersion retrieves a setup version by its unique identifier.
  rpc GetSetupVersion(GetSetupVersionRequest) returns (GetSetupVersionResponse);
  // ListSetupVersions retrieves a page of the versions of a setup, most recent first.
  rpc ListSetupVersions(ListSetupVersionsRequest) returns (ListSetupVersionsResponse);
  // UpdateSetupVersion edits a setup version in place.
  rpc UpdateSetupVersion(UpdateSetupVersionRequest) returns (UpdateSetupVersionResponse);
  // SetCurrentSetupVersion activates an existing version of a setup.
  rpc SetCurrentSetupVersion(SetCurrentSetupVersionRequest) returns (SetCurrentSetupVersionResponse);
  // DeleteSetupVersion deletes a setup version.
  rpc DeleteSetupVersion(DeleteSetupVersionRequest) returns (DeleteSetupVersionResponse);
}
