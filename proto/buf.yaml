version: v2

name: buf.build/agentic-mesh-protocol/agentic-mesh-protocol

deps:
  - buf.build/bufbuild/protovalidate

lint:
  use:
    - STANDARD
    - COMMENTS
    - FILE_LOWER_SNAKE_CASE
    - PROTOVALIDATE
  except:
    - ENUM_VALUE_PREFIX
  enum_zero_value_suffix: _UNSPECIFIED
  service_suffix: Service

breaking:
  use:
    - FILE
    - PACKAGE
    - WIRE_JSON
  ignore_unstable_packages: true
